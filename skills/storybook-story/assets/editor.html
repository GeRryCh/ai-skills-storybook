<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Storybook Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ══ Design system ═════════════════════════════════════════════════════════
   Stitch project "Storybook editor" (projects/3194105875153500433), design
   system assets/3832573499565723133 — a Material-3 scheme seeded from #4f46e5.

   The --m3-* block below is copied VERBATIM from that project's designTheme
   .namedColors payload; do not hand-tune those values. Everything under
   "semantic aliases" is this editor's own vocabulary, mapped onto those roles,
   and is what the rest of the stylesheet consumes.
   ────────────────────────────────────────────────────────────────────────── */
:root{
  /* ── Material-3 roles, verbatim from Stitch (light scheme) ── */
  --m3-primary:#3525cd;                   --m3-on-primary:#ffffff;
  --m3-primary-container:#4f46e5;         --m3-on-primary-container:#dad7ff;
  --m3-primary-fixed:#e2dfff;             --m3-primary-fixed-dim:#c3c0ff;
  --m3-on-primary-fixed:#0f0069;          --m3-on-primary-fixed-variant:#3323cc;
  --m3-secondary:#58579b;                 --m3-on-secondary:#ffffff;
  --m3-secondary-container:#b6b4ff;       --m3-on-secondary-container:#454386;
  --m3-secondary-fixed:#e2dfff;           --m3-secondary-fixed-dim:#c3c0ff;
  --m3-on-secondary-fixed:#140f54;        --m3-on-secondary-fixed-variant:#413f82;
  --m3-tertiary:#7e3000;                  --m3-on-tertiary:#ffffff;
  --m3-tertiary-container:#a44100;        --m3-on-tertiary-container:#ffd2be;
  --m3-tertiary-fixed:#ffdbcc;            --m3-tertiary-fixed-dim:#ffb695;
  --m3-on-tertiary-fixed:#351000;         --m3-on-tertiary-fixed-variant:#7b2f00;
  --m3-error:#ba1a1a;                     --m3-on-error:#ffffff;
  --m3-error-container:#ffdad6;           --m3-on-error-container:#93000a;
  --m3-background:#fcf8ff;                --m3-on-background:#1b1b24;
  --m3-surface:#fcf8ff;                   --m3-on-surface:#1b1b24;
  --m3-surface-variant:#e4e1ee;           --m3-on-surface-variant:#464555;
  --m3-surface-bright:#fcf8ff;            --m3-surface-dim:#dcd8e5;
  --m3-surface-container-lowest:#ffffff;  --m3-surface-container-low:#f5f2ff;
  --m3-surface-container:#f0ecf9;         --m3-surface-container-high:#eae6f4;
  --m3-surface-container-highest:#e4e1ee;
  --m3-outline:#777587;                   --m3-outline-variant:#c7c4d8;
  --m3-inverse-surface:#302f39;           --m3-inverse-on-surface:#f3effc;
  --m3-inverse-primary:#c3c0ff;           --m3-surface-tint:#4d44e3;

  /* ── semantic aliases ──
     Elevation reads as the Cast screen does it: tinted --m3-background ground,
     white --m3-surface-container-lowest cards. (The Pages screen inverts the
     two; Stitch is internally inconsistent there, so one reading is picked and
     applied everywhere rather than reconciled.) */
  --bg:var(--m3-background);
  --surface:var(--m3-surface-container-lowest);
  --surface-sunken:var(--m3-surface-container-low);
  --surface-hover:var(--m3-surface-container-high);
  --border:var(--m3-outline-variant);
  --border-soft:var(--m3-surface-variant);
  --text:var(--m3-on-surface);
  --text-muted:var(--m3-on-surface-variant);
  --text-faint:var(--m3-outline);
  --accent:var(--m3-primary);
  --accent-strong:var(--m3-primary-container);
  --accent-contrast:var(--m3-on-primary);
  --accent-soft:var(--m3-secondary-container);
  --accent-soft-text:var(--m3-on-secondary-container);
  --accent-ring:rgba(53,37,205,.28);
  --danger-bg:var(--m3-error-container);   --danger-text:var(--m3-on-error-container);
  --danger-border:#f3b6ae;
  --warn-bg:var(--m3-tertiary-fixed);      --warn-text:var(--m3-on-tertiary-fixed-variant);
  --warn-border:var(--m3-tertiary-fixed-dim);
  /* Stitch's own markup reaches past the scheme for "rendered/done" states and
     uses literal Tailwind greens (green-100/800/200, check icon #16a34a); the
     M3 palette it emitted has no success role, so those literals are kept. */
  --success-bg:#dcfce7; --success-text:#166534; --success-border:#bbf7d0;
  --success-icon:#16a34a;
  --info-bg:var(--m3-secondary-fixed);     --info-text:var(--m3-on-secondary-fixed);
  --neutral-bg:var(--m3-surface-variant);  --neutral-text:var(--m3-on-surface-variant);

  /* ── shape / type / metrics, from the same design system ── */
  --radius-sm:4px;    /* borderRadius.DEFAULT */
  --radius-md:8px;    /* borderRadius.lg */
  --radius-lg:12px;   /* borderRadius.xl */
  --radius-xl:16px;   /* rounded-2xl, used on page cards */
  --radius-full:9999px;
  --shadow-card:0 1px 2px rgba(27,27,36,.06),0 1px 3px rgba(27,27,36,.04);
  --shadow-hover:0 4px 12px rgba(27,27,36,.10);
  --shadow-pop:0 12px 32px rgba(27,27,36,.18);
  --font-headline:'Space Grotesk','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-label:'Public Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --sidebar-w:256px;  /* w-64 */
  --topbar-h:64px;    /* h-16 */
}
/* Dark scheme. Stitch emits a LIGHT scheme only, so the accent, outline and
   on-surface roles below are taken from the mode-independent *-fixed / inverse-*
   tokens it *did* emit (M3 defines dark primary as primary-fixed-dim, dark
   on-surface as inverse-on-surface, and swaps the outline pair). The neutral
   surface ramp and the success trio have no Stitch counterpart at all and are
   carried over unchanged from the previous revision — they are the only values
   here not traceable to the design system. */
@media (prefers-color-scheme:dark){:root{
  --bg:#131218; --surface:#1e1c26; --surface-sunken:#191822; --surface-hover:#2a2833;
  --border:var(--m3-on-surface-variant);        /* light on-surface-variant ↔ dark outline */
  --border-soft:var(--m3-inverse-surface);
  --text:var(--m3-inverse-on-surface);
  --text-muted:var(--m3-outline-variant);       /* light outline-variant ↔ dark on-surface-variant */
  --text-faint:#918f9f;
  --accent:var(--m3-primary-fixed-dim);
  --accent-strong:var(--m3-primary-fixed);
  --accent-contrast:var(--m3-on-primary-fixed);
  --accent-soft:var(--m3-on-secondary-fixed-variant);
  --accent-soft-text:var(--m3-secondary-fixed);
  --accent-ring:rgba(195,192,255,.32);
  --danger-bg:var(--m3-on-error-container);  --danger-text:var(--m3-error-container);
  --danger-border:var(--m3-error);
  --warn-bg:var(--m3-on-tertiary-fixed-variant); --warn-text:var(--m3-tertiary-fixed);
  --warn-border:var(--m3-tertiary-container);
  --success-bg:#0f3d24; --success-text:#bbf7d0; --success-border:#1c6a41;
  --success-icon:#4ade80;
  --info-bg:var(--m3-on-secondary-fixed-variant); --info-text:var(--m3-secondary-fixed);
  --neutral-bg:#2a2833; --neutral-text:var(--m3-outline-variant);
  --shadow-card:0 1px 2px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.24);
  --shadow-hover:0 4px 12px rgba(0,0,0,.5);
  --shadow-pop:0 12px 32px rgba(0,0,0,.6);
}}

/* ── reset + base ─────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);font-size:14px;background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
small{color:var(--text-faint);font-size:12px}
code,.mono{font-family:var(--font-mono)}
.hint,.muted{color:var(--text-faint)}
.loading-hint{color:var(--text-faint);padding:20px}
.load-error{color:var(--danger-text);padding:20px}

/* ── Material Symbols, inlined as SVG (see ICON_PATHS) ─────────────────── */
.mi{width:1.25em;height:1.25em;flex-shrink:0;fill:currentColor;vertical-align:-.28em}
.mi-sm{width:1em;height:1em;vertical-align:-.18em}
.mi-lg{width:1.5em;height:1.5em;vertical-align:-.35em}
.mi-spin{animation:mi-spin 1.1s linear infinite}
@keyframes mi-spin{to{transform:rotate(360deg)}}

/* ── app shell: top bar + sidebar + scrolling pane ───────────────────────── */
header{flex:0 0 auto;position:sticky;top:0;z-index:100;height:var(--topbar-h);
  background:var(--surface);color:var(--text);border-bottom:1px solid var(--border);
  padding:0 24px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-card)}
.app-name{font-family:var(--font-headline);font-size:20px;font-weight:700;color:var(--accent);
  letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
header h1{font-family:var(--font-label);font-size:17px;font-weight:600;color:var(--text);flex:1;
  min-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .dirty-dot{color:var(--accent);font-size:15px;display:none;line-height:1}
header .dirty-dot.visible{display:inline}
.autosave-hint{font-size:11px;color:var(--accent);opacity:.9;font-family:var(--font-label)}
.cost-readout{font-size:13px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.save-state{color:var(--text-muted);display:flex;align-items:center}

.status-panel{flex:0 0 auto;padding:10px 24px;font-size:13px;display:none}
.status-panel.error{background:var(--danger-bg);color:var(--danger-text);display:block}
.status-panel.warn{background:var(--warn-bg);color:var(--warn-text);display:block}
.status-panel ul{padding-left:18px}

#main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:var(--sidebar-w) 1fr;overflow:hidden}
.sidebar{overflow-y:auto;background:var(--surface-sunken);border-right:1px solid var(--border);
  display:flex;flex-direction:column;justify-content:space-between;padding:16px;gap:16px}
.side-nav{display:flex;flex-direction:column;gap:4px;min-height:0}
.side-link{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--radius-lg);
  font-family:var(--font-label);font-size:14px;font-weight:500;color:var(--text-muted);
  text-decoration:none;cursor:pointer;user-select:none;transition:background .15s,color .15s}
.side-link:hover{background:var(--surface-hover);color:var(--accent)}
.side-link.active{background:var(--accent-soft);color:var(--accent-soft-text);font-weight:700}
.side-count{margin-left:auto;background:var(--neutral-bg);color:var(--neutral-text);
  font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--radius-full)}
.side-link.active .side-count{background:var(--surface);color:var(--accent-soft-text)}
.side-pages-label{margin-top:6px;cursor:default}
/* :not(.active) — the plain-hover reset must not out-specify the scroll-spy's
   active state, which it otherwise ties with and wins on source order. */
.side-pages-label:not(.active):hover{background:none;color:var(--text-muted)}
/* Nested page list — Stitch renders this as an indented rail under "Pages". */
.side-pages-list{display:flex;flex-direction:column;gap:2px;margin:8px 0 0 24px;padding-left:12px;
  border-left:2px solid var(--border-soft);max-height:38vh;overflow-y:auto}
.side-page-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--radius-md);
  font-family:var(--font-label);font-size:12px;color:var(--text-muted);text-decoration:none;
  cursor:pointer;transition:background .15s,color .15s}
.side-page-row:hover{background:var(--surface-hover);color:var(--accent)}
.side-page-row .side-page-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--border);
  flex-shrink:0}
.side-dot.rendered{background:var(--success-icon)}
.side-footer{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--border)}
.btn-block{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--font-label);font-weight:700;padding:9px 16px;border-radius:var(--radius-lg)}
.btn-outline{background:var(--surface);color:var(--text-muted);border:1px solid var(--border)}
.btn-outline:hover:not(:disabled){background:var(--surface-hover)}
.regen-all-status-wrap{font-size:11px;color:var(--text-faint);text-align:center}

.pane{overflow-y:auto;padding:32px;background:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  margin-bottom:32px;box-shadow:var(--shadow-card);max-width:1100px;overflow:hidden}
.panel-head{font-family:var(--font-headline);font-size:18px;font-weight:600;padding:18px 20px;
  background:var(--surface-sunken);border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:12px}
.panel-icon{color:var(--accent);display:flex}
.panel-hint{font-family:var(--font-body);font-weight:400;color:var(--text-faint);font-size:12px}
/* One chevron rotated by CSS carries the open/closed cue for both the section
   panels and the cast/page cards — the two used to swap ▼/▶ glyphs instead. */
.panel-head .toggle,.card-header .toggle{margin-left:auto;color:var(--text-muted);
  display:flex;flex-shrink:0;transition:transform .2s}
.card-header .toggle{margin-left:0}
.panel-head .toggle.collapsed,.card-header .toggle.collapsed{transform:rotate(-90deg)}
.section-body{padding:24px}
.section-body.collapsed{display:none}
.section-bar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border-soft)}
.section-bar h3{font-family:var(--font-headline);font-size:16px;font-weight:700;color:var(--text)}

@media (max-width:860px){
  #main{grid-template-columns:1fr;overflow-y:auto}
  .sidebar{flex-direction:row;flex-wrap:wrap;overflow-x:auto;overflow-y:visible;
    border-right:none;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
  .side-nav{flex-direction:row;flex-wrap:wrap}
  .side-pages-list{max-height:none;margin-left:0;border-left:none;padding-left:0;flex-direction:row}
  .side-footer{flex-direction:row;border-top:none;padding-top:0}
  .pane{overflow-y:visible;padding:20px}
}

/* ── form elements ────────────────────────────────────────────────────── */
.field{margin-bottom:18px}
.field.field-narrow{max-width:260px}
.field label{display:block;font-family:var(--font-label);font-size:13px;font-weight:500;
  color:var(--text-muted);margin-bottom:6px}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid var(--border);
  border-radius:var(--radius-md);padding:10px 12px;font-size:14px;font-family:var(--font-body);
  background:var(--surface-sunken);color:var(--text);transition:border-color .15s,box-shadow .15s}
.field input[type=text]:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field select.unset{color:var(--text-faint)}
/* ── Conditional field relevance (PER-48) ─────────────────────────────── */
.field.dep-hidden{display:none}
.field .row{display:flex;gap:8px;align-items:flex-start}
.field .row input{flex:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}

.fieldset-box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;
  margin-bottom:18px;background:var(--surface-sunken)}
.fieldset-legend{font-family:var(--font-label);font-size:12px;font-weight:700;color:var(--text-muted);
  padding:0 8px;text-transform:uppercase;letter-spacing:.06em}

/* ── buttons ──────────────────────────────────────────────────────────── */
button{cursor:pointer;border:none;border-radius:var(--radius-md);padding:8px 16px;font-size:13px;
  font-family:var(--font-label);font-weight:600;
  transition:background .15s,box-shadow .15s,transform .1s,color .15s}
button:active:not(:disabled){transform:scale(.96)}
.btn-primary{background:var(--accent);color:var(--accent-contrast)}
.btn-primary:hover:not(:disabled){background:var(--accent-strong);color:var(--accent-contrast)}
.btn-primary:disabled{background:var(--neutral-bg);color:var(--text-faint);cursor:not-allowed}
.btn-sm{background:var(--neutral-bg);color:var(--text-muted);padding:4px 12px;font-size:12px;
  border-radius:var(--radius-md)}
.btn-sm:hover{background:var(--surface-hover)}
.btn-danger{background:var(--danger-bg);color:var(--danger-text)}
.btn-danger:hover{background:var(--danger-border)}
.btn-add{background:var(--surface);color:var(--accent);border:1px dashed var(--border);
  display:inline-flex;align-items:center;gap:6px}
.btn-add:hover{border-color:var(--accent);background:var(--surface-hover)}
.btn-icon{background:none;color:var(--text-muted);padding:6px;border-radius:var(--radius-full);
  display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--surface-hover);color:var(--accent)}

/* ── palette ──────────────────────────────────────────────────────────── */
/* Stitch draws each palette entry as a round swatch. It pairs the swatch with a
   bare hex; this repo's entries are prose *containing* a hex ("warm cream
   #F5E9D4"), so the label stays a full-width text input beside the circle
   rather than a 96px caption under it. */
.palette-grid{display:flex;flex-direction:column;gap:10px}
.palette-row{display:flex;align-items:center;gap:12px}
.palette-row input{flex:1}
.swatch{width:40px;height:40px;border-radius:var(--radius-full);border:1px solid var(--border);
  flex-shrink:0;background:var(--surface-hover);box-shadow:var(--shadow-card);
  transition:transform .15s}
.swatch:hover{transform:scale(1.08)}
.palette-row .btn-danger{padding:5px 10px;flex-shrink:0}

/* ── character + page cards ───────────────────────────────────────────── */
.card{border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px;
  overflow:hidden;background:var(--surface);box-shadow:var(--shadow-card);
  transition:box-shadow .15s}
.card:hover{box-shadow:var(--shadow-hover)}
.card-header{padding:16px 20px;display:flex;align-items:center;gap:10px;
  font-family:var(--font-headline);font-size:16px;font-weight:600;cursor:pointer;
  background:var(--surface-sunken);border-bottom:1px solid transparent}
.card-header:hover{background:var(--surface-hover)}
.card-header .card-avatar{width:40px;height:40px;border-radius:var(--radius-full);object-fit:cover;
  border:2px solid var(--surface);box-shadow:var(--shadow-card);flex-shrink:0;
  background:var(--surface-hover)}
.card-header .card-avatar-ph{width:40px;height:40px;border-radius:var(--radius-full);flex-shrink:0;
  border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;
  color:var(--text-faint);background:var(--surface-sunken)}
.card-header .card-title{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card-header .card-id{font-family:var(--font-mono);font-size:11px;font-weight:400;color:var(--text-faint);
  flex-shrink:0}
.card-header .badge-dirty{color:var(--accent);font-size:11px;display:none}
.card-header .badge-dirty.visible{display:inline}
.card-header .badge-render{font-family:var(--font-label);font-size:11px;font-weight:500;
  padding:2px 10px;border-radius:var(--radius-full);border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px}
.badge-render::before{content:"";width:6px;height:6px;border-radius:var(--radius-full);
  background:currentColor;opacity:.75}
.badge-render.rendered{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border)}
.badge-render.edited{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border)}
.badge-render.none{background:var(--neutral-bg);color:var(--neutral-text);border-color:var(--border)}
.badge-refs{font-family:var(--font-label);font-size:11px;padding:2px 10px;
  border-radius:var(--radius-full);font-weight:500;display:none;border:1px solid transparent}
.badge-refs.warn{background:var(--warn-bg);color:var(--warn-text);border-color:var(--warn-border);display:inline}
.badge-refs.over{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border);display:inline}
.card-header .spacer{flex:1}
.card-header button{font-size:11px;padding:3px 10px}
.card-body{padding:20px;display:none;border-top:1px solid var(--border)}
.card-body.open{display:block}
.card-body.split-body{padding:0}
/* Style-sheet footer block on a cast card (Stitch: sunken strip, uppercase label). */
.sheet-block{margin:20px -20px -20px;padding:20px;background:var(--surface-sunken);
  border-top:1px solid var(--border)}
.sheet-block-head{display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:12px}
.sheet-block-title{font-family:var(--font-label);font-size:11px;font-weight:700;color:var(--text);
  text-transform:uppercase;letter-spacing:.08em}
.inuse-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-label);
  font-size:10px;font-weight:600;padding:3px 9px;border-radius:var(--radius-md);
  background:var(--info-bg);color:var(--info-text)}
.inuse-chip::before{content:"";width:6px;height:6px;border-radius:var(--radius-full);
  background:var(--accent);animation:mi-pulse 2s ease-in-out infinite}
@keyframes mi-pulse{50%{opacity:.35}}

.hero-badge{background:var(--accent);color:var(--accent-contrast);font-size:9px;padding:1px 6px;
  border-radius:var(--radius-full);font-weight:700;letter-spacing:.04em}
.kind-badge{display:inline-block;font-family:var(--font-mono);font-size:9px;font-weight:600;
  padding:1px 5px;border-radius:var(--radius-sm);background:var(--neutral-bg);color:var(--neutral-text);
  border:1px solid var(--border);vertical-align:middle;letter-spacing:.5px}

/* ── page cast chips (derived from the prompt's <id> mentions) ─────────── */
.cast-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.cast-entry{display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-soft);color:var(--accent-soft-text);
  border-radius:var(--radius-md);padding:5px 10px;font-family:var(--font-label);font-size:12px;
  font-weight:500}
.cast-entry .mi{color:currentColor;opacity:.8}
.cast-entry span{font-size:12px}
.uncast-btns{display:flex;flex-wrap:wrap;gap:6px}
.btn-cast-add{background:var(--info-bg);color:var(--info-text);font-size:12px;padding:3px 10px;
  border-radius:var(--radius-md);border:none;cursor:pointer}
.btn-cast-add:hover{filter:brightness(.96)}
.cast-entry.readonly{background:var(--accent-soft)}
.cast-empty{font-size:12px;color:var(--text-faint);font-style:italic;padding:2px 0}

/* ── ref-image rows ───────────────────────────────────────────────────── */
.ref-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ref-row input{flex:1}
.ref-thumb{width:48px;height:48px;object-fit:cover;border-radius:var(--radius-md);
  border:1px solid var(--border);flex-shrink:0}
.ref-miss{width:48px;height:48px;border-radius:var(--radius-md);background:var(--danger-bg);
  border:1px solid var(--danger-border);display:none;font-size:9px;color:var(--danger-text);
  text-align:center;line-height:46px;flex-shrink:0}

/* ── style sheet preview ──────────────────────────────────────────────── */
.sheet-preview{display:flex;gap:12px;align-items:flex-start;margin-top:4px}
.sheet-preview img{width:64px;height:64px;object-fit:cover;border-radius:var(--radius-md);
  border:1px solid var(--border)}
.sheet-preview .sheet-path{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
  word-break:break-all}
.sheet-preview .sheet-missing{color:var(--danger-text);font-size:12px}
/* ── sheet version history ────────────────────────────────────────────── */
.sheet-ver-wrap{margin-top:6px}
.sheet-ver-img{max-width:100%;width:220px;aspect-ratio:4/3;object-fit:cover;
  border-radius:var(--radius-md);border:1px solid var(--border);display:block;
  background:var(--surface-hover)}
.style-frame-img{max-height:120px;display:block}
.warn-inline{color:var(--warn-text);font-size:12px;margin-top:4px}
.hint-block{color:var(--text-faint);font-size:13px}

/* ── saved-formats toggle ─────────────────────────────────────────────── */
.sf-toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.sf-toggle-row label{display:flex;gap:6px;align-items:center;cursor:pointer}
.sf-hint{font-size:12px;color:var(--text-faint)}
.sf-checks{display:flex;gap:12px;align-items:center}
.sf-checks label{display:flex;gap:4px;align-items:center;font-size:13px;cursor:pointer}

/* ── page card two-column split (Stitch: 1/3 art rail + 2/3 editor) ───── */
.page-split{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;align-items:start}
.page-art{padding:24px;background:var(--surface-sunken);border-right:1px solid var(--border);
  align-self:stretch}
.page-fields{padding:24px;min-width:0}
@media (max-width:1000px){
  .page-split{grid-template-columns:1fr}
  .page-art{border-right:none;border-bottom:1px solid var(--border)}
}

/* ── page image preview + generation history ──────────────────────────── */
.pg-preview-wrap{margin-bottom:0}
.preview-img-area{margin-bottom:4px}
.preview-pair{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.preview-img-wrap{position:relative;display:inline-block;max-width:100%}
.textpage-badge{background:var(--text);color:var(--bg);font-size:10px;
  padding:2px 8px;border-radius:var(--radius-sm);font-weight:600;pointer-events:none;white-space:nowrap;
  font-family:var(--font-mono)}
.preview-img{max-width:100%;max-height:300px;border-radius:var(--radius-lg);
  border:1px solid var(--border);display:block;background:var(--surface-hover);
  box-shadow:var(--shadow-card)}
.preview-overlay{position:absolute;top:8px;right:8px}
.inuse-badge{background:var(--success-icon);color:#fff;font-size:10px;padding:2px 8px;
  border-radius:var(--radius-full);font-weight:600;pointer-events:none;white-space:nowrap;
  font-family:var(--font-label)}
.btn-use-version{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success-border);
  font-size:11px;padding:3px 10px;border-radius:var(--radius-full);cursor:pointer;font-weight:600;
  white-space:nowrap}
.btn-use-version:hover{filter:brightness(.96)}
.preview-nav{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:12px;
  color:var(--text-muted)}
.preview-nav .btn-sm{background:none;color:var(--text-muted);display:inline-flex;align-items:center;
  gap:2px;font-weight:600;padding:2px 6px}
.preview-nav .btn-sm:hover:not(:disabled){background:none;color:var(--accent)}
.preview-nav .btn-sm:disabled{opacity:.4;cursor:not-allowed}
.ver-counter{font-size:11px;color:var(--text-muted);min-width:38px;text-align:center;
  font-family:var(--font-label)}
.regen-error{color:var(--danger-text);font-size:12px;margin-top:6px;background:var(--danger-bg);
  border-radius:var(--radius-md);padding:8px 10px}
.regen-error pre{white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:var(--font-mono);
  margin-top:2px;max-height:100px;overflow:auto}
.preview-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-regen{background:var(--surface);color:var(--text-muted);font-size:12px;padding:7px 14px;
  border-radius:var(--radius-lg);border:1px solid var(--border);font-family:var(--font-label);
  font-weight:700;box-shadow:var(--shadow-card);display:inline-flex;align-items:center;gap:6px}
.btn-regen:hover:not(:disabled){background:var(--surface-hover);cursor:pointer}
.btn-regen:disabled{background:var(--neutral-bg);color:var(--text-faint);cursor:not-allowed;
  box-shadow:none}
.btn-regen-secondary{background:none;color:var(--text-faint);border:1px solid transparent;
  font-size:11px;font-weight:500;box-shadow:none;padding:5px 10px}
.btn-regen-secondary:hover:not(:disabled){background:var(--surface-hover);cursor:pointer}
.btn-recomp{background:var(--accent);color:var(--accent-contrast);font-size:12px;padding:7px 14px;
  border-radius:var(--radius-lg);border:none;font-family:var(--font-label);font-weight:700;
  box-shadow:var(--shadow-card);display:inline-flex;align-items:center;gap:6px}
.btn-recomp:hover:not(:disabled){background:var(--accent-strong);color:var(--accent-contrast);
  cursor:pointer}
.btn-recomp:disabled{background:var(--neutral-bg);color:var(--text-faint);cursor:not-allowed;box-shadow:none}
.regen-status-inline{font-size:11px;color:var(--text-faint)}

/* Shared modal chrome (confirm + consolidate) */
dialog.app-modal,dialog#consolidate-modal{margin:auto;border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:0;max-width:512px;width:90%;box-shadow:var(--shadow-pop);
  background:var(--surface);color:var(--text)}
dialog.app-modal::backdrop,dialog#consolidate-modal::backdrop{
  background:rgba(27,27,36,.2);backdrop-filter:blur(4px)}
dialog.app-modal{padding:24px}
.modal-msg{white-space:pre-wrap;font-size:14px;color:var(--text);margin:0 0 16px;line-height:1.5}
.modal-suppress-row{margin-bottom:14px}
.modal-suppress-row label{font-size:12px;color:var(--text-faint);display:flex;gap:6px;align-items:center;cursor:pointer}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
/* Consolidate modal — Stitch splits it into head / body / status footer. */
.cm-head{padding:20px 24px;border-bottom:1px solid var(--border)}
.cm-head h3{margin:0;font-family:var(--font-headline);font-size:22px;font-weight:700;color:var(--text)}
.cm-head p{margin-top:4px;font-size:13px;color:var(--text-muted)}
.cm-body{padding:20px 24px}
.cm-section{margin-bottom:16px}
.cm-section label{font-size:14px;font-weight:400;color:var(--text);display:flex;
  gap:12px;align-items:center;cursor:pointer}
.cm-section label:hover{color:var(--accent)}
.cm-section .cm-legend{font-family:var(--font-label);font-size:12px;font-weight:700;
  color:var(--text);margin-bottom:12px;display:block;text-transform:uppercase;letter-spacing:.08em}
.cm-zip-row{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.cm-zip-row small{font-size:12px;color:var(--text-muted)}
.cm-results{margin:0;padding:16px 24px;background:var(--surface-sunken);border-top:1px solid var(--border)}
.cm-results:empty{display:none}
.cm-result-item{font-size:13px;padding:5px 0;display:flex;gap:10px;align-items:flex-start}
.cm-result-ok{color:var(--success-text)}
.cm-result-err{color:var(--danger-text)}
.cm-result-err pre{white-space:pre-wrap;word-break:break-all;font-size:11px;font-family:var(--font-mono);
  margin-top:2px;background:var(--danger-bg);border-radius:var(--radius-md);padding:6px 10px;
  max-height:80px;overflow:auto}
.cm-actions{display:flex;gap:12px;padding:0 24px 20px}
.cm-actions button{flex:1;padding:10px 24px;border-radius:var(--radius-md);font-weight:700}
.cm-actions .btn-sm{font-size:14px;background:var(--surface);border:1px solid var(--border);
  color:var(--text)}

/* ── @-mention picker (image_prompt cast picker) ────────────────────────── */
#mention-pop{position:fixed;z-index:900;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);
  min-width:220px;max-width:340px;padding:6px 0;display:none;overflow:hidden}
.mention-row{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;
  font-size:13px;white-space:nowrap}
.mention-row:hover,.mention-row.hl{background:var(--accent-soft)}
.mention-row .m-name{flex:1;color:var(--text);font-weight:500;font-family:var(--font-label)}
.mention-row .m-kind{font-family:var(--font-mono);font-size:10px;padding:1px 6px;
  border-radius:var(--radius-sm);background:var(--neutral-bg);color:var(--neutral-text);
  font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.mention-row .m-id{font-size:11px;color:var(--text-faint);font-family:var(--font-mono)}
/* PER-97: character-lane-full rows stay visible but inert, with a reason line
   appended below the list — a silently shorter list is worse than a greyed one. */
.mention-row.blocked{cursor:not-allowed;opacity:.45}
.mention-row.blocked:hover{background:none}
.mention-note{padding:6px 10px;font-size:11px;color:var(--warn-text);background:var(--warn-bg);
  border-top:1px solid var(--warn-border);white-space:normal;max-width:320px;line-height:1.4}
</style>
</head>
<body>

<header>
  <span class="app-name"><svg class="mi" id="brand-icon" viewBox="0 -960 960 960" aria-hidden="true"></svg>Storybook Editor</span>
  <h1 id="header-title">story.json editor</h1>
  <span class="dirty-dot" id="dirty-dot" title="Unsaved changes">●</span>
  <span id="autosave-hint" class="autosave-hint" style="display:none"></span>
  <span id="cost-readout" class="cost-readout" title=""></span>
  <span class="save-state" id="save-state" title="Saved"><svg class="mi" id="save-state-icon" viewBox="0 -960 960 960" aria-hidden="true"></svg></span>
  <button class="btn-primary" id="btn-save" onclick="triggerSave()">Save</button>
</header>

<div class="status-panel" id="status-panel"></div>

<main id="main">
  <p class="loading-hint">Loading…</p>
</main>

<!-- Generic confirm modal — avoids browser "suppress dialogs" killing confirm() -->
<dialog class="app-modal" id="confirm-modal">
  <p id="confirm-msg" class="modal-msg"></p>
  <div id="confirm-suppress-row" class="modal-suppress-row" style="display:none">
    <label>
      <input type="checkbox" id="confirm-suppress-cb"> Don't ask me again this session
    </label>
  </div>
  <div class="modal-actions">
    <button class="btn-sm" id="confirm-cancel">Cancel</button>
    <button class="btn-primary" id="confirm-ok">OK</button>
  </div>
</dialog>

<!-- Consolidate Story modal — lives outside <main> so renderAll() wipes don't remove it -->
<dialog id="consolidate-modal">
  <div class="cm-head">
    <h3>Consolidate Story</h3>
    <p>Package this book into distributable formats. Stage 4 — free, no API calls.</p>
  </div>
  <div class="cm-body">
    <div class="cm-section">
      <span class="cm-legend">Export formats</span>
      <div id="sf-container"></div>
      <div class="cm-zip-row">
        <label>
          <input type="checkbox" id="cm-zip">
          also build zip package <small>(run-time only — story.json + pages + sheets + book files)</small>
        </label>
      </div>
    </div>
  </div>
  <div class="cm-actions">
    <button class="btn-primary" id="cm-run" onclick="runConsolidate()">Run</button>
    <button class="btn-sm" onclick="closeConsolidateModal()">Close</button>
  </div>
  <div class="cm-results" id="cm-results"></div>
</dialog>

// Every symbol ships on the -960 grid except this one legacy export.
const ICON_VIEWBOX = {auto_fix_high: '0 0 24 24'};

/** Inline <svg> markup for a Material Symbol. Unknown name → empty string. */
function icon(name, cls) {
  const d = ICON_PATHS[name];
  if (!d) return '';
  const vb = ICON_VIEWBOX[name] || '0 -960 960 960';
  return `<svg class="mi${cls ? ' ' + cls : ''}" viewBox="${vb}" aria-hidden="true"><path d="${d}"/></svg>`;
}

/** Paint an icon into an existing <svg class="mi"> placeholder (static markup). */
function paintIcon(el, name) {
  if (!el || !ICON_PATHS[name]) return;
  el.setAttribute('viewBox', ICON_VIEWBOX[name] || '0 -960 960 960');
  el.innerHTML = `<path d="${ICON_PATHS[name]}"/>`;
}

// ── Custom confirm dialog (avoids browser "suppress dialogs" breaking confirm()) ──
// suppressKey: pass a string to show "Don't ask me again this session" checkbox.
// Once suppressed, future calls with the same key auto-resolve true.
const _suppressedConfirms = new Set();
function customConfirm(msg, suppressKey) {
  if (suppressKey && _suppressedConfirms.has(suppressKey)) return Promise.resolve(true);
  return new Promise(resolve => {
    const dlg     = document.getElementById('confirm-modal');
    const msgEl   = document.getElementById('confirm-msg');
    const okBtn   = document.getElementById('confirm-ok');
    const canBtn  = document.getElementById('confirm-cancel');
    const suppRow = document.getElementById('confirm-suppress-row');
    const suppCb  = document.getElementById('confirm-suppress-cb');
    msgEl.textContent = msg;
    if (suppressKey) { suppRow.style.display = ''; suppCb.checked = false; }
    else             { suppRow.style.display = 'none'; }
    function finish(val) {
      dlg.close();
      if (val && suppressKey && suppCb.checked) _suppressedConfirms.add(suppressKey);
      resolve(val);
    }
    okBtn.onclick  = () => finish(true);
    canBtn.onclick = () => finish(false);
    dlg.onclose    = () => resolve(false); // ESC key
    dlg.showModal();
  });
}

// ── State ──────────────────────────────────────────────────────────────────
let story = null;
let schema = null;
let storyMtime = null;
const dirtyPages  = new Set(); // unsaved changes — header dot + beforeunload guard
const editedPages = new Set(); // edited since last render — amber badge (not cleared on save)
let renderStatus = {};
let charStatusData = {};
let styleFrameExists = false; // PER-82: book-wide style frame — read-only preview flag

// PER-35: apply a /api/status response — the three assignments below were
// previously repeated at every call site; centralized here so the cost
// readout updates everywhere status does, with no site left stale.
function applyStatus(sd) {
  renderStatus     = sd.pages || {};
  charStatusData   = sd.cast  || {};
  styleFrameExists = !!sd.style_frame_exists;
  renderCostReadout(sd.costs);
}

function renderCostReadout(c) {
  const el = document.getElementById('cost-readout');
  if (!el) return;
  if (!c || !c.calls) { el.textContent = ''; el.title = ''; return; }
  const prefix = c.estimated ? '~' : '';
  const unpriced = c.unpriced ? ` · ${c.unpriced} unpriced` : '';
  el.textContent = `${prefix}$${c.total_usd.toFixed(2)}${unpriced}`;
  const byScript = Object.entries(c.by_script || {})
    .map(([s, v]) => `${s}  $${v.toFixed(2)}`).join('\n');
  el.title = [
    byScript,
    `${c.calls} call${c.calls === 1 ? '' : 's'} total` + (c.as_of ? ` · prices as of ${c.as_of}` : ''),
  ].filter(Boolean).join('\n');
}
// ── Auto-save state ────────────────────────────────────────────────────────
let autoSaveTimer  = null;  // debounce handle
let saveInFlight   = false; // one PUT at a time
let savePending    = false; // markDirty fired while saveInFlight
let autoSavePaused = false; // set on 409 (concurrent writer); cleared only by reload
// ── Version-history state ───────────────────────────────────────────────────
const _pageVersionData  = new Map(); // page_num → {versions: [...], viewIdx: int, fast: {...}}
const _regenPolls       = new Map(); // page_num → intervalId
// ── Sheet version-history state ─────────────────────────────────────────────
const _sheetVersionData = new Map(); // name → {versions: [...], viewIdx: int}
const _sheetPolls       = new Map(); // name → intervalId
// ── Regenerate-all state ─────────────────────────────────────────────────────
let _regenAllPoll    = null;  // intervalId while a regenerate-all run is in progress
let _regenAllRunning = false; // true while the run is in-flight (flag for card rebuilds)
// ── Smart-regenerate / Pillow-only tracking ──────────────────────────────────
// editedFields: per-page tracking of which story.json fields changed since the
// last completed render or recomposite (cleared on done, not on save).
// bookPaidEdit: sticky flag — any render-affecting book-level edit forces paid
// for every page; cleared only by page reload.
const editedFields = new Map();   // pageObj → Set<fieldKey>
let   bookPaidEdit = false;
let   unsavedChanges = false; // any unsaved edit (page, cast, or book-level)
// Fields that only affect Pillow post-processing in overlay/long mode —
// changing only these fields makes the fast "Re-composite (free)" path eligible.
// (text_background_prompt excluded: needs a paid bg call.)
const PILLOW_FIELDS = new Set(['text', 'text_placement', 'text_color_hint', 'text_align', 'font']);
// Book-level fields that don't affect renders at all — changes to these never
// set bookPaidEdit (e.g. title is metadata only; saved_formats is a consolidate hint).
const NEUTRAL_BOOK_FIELDS = new Set(['title', 'language', 'saved_formats']);

// ── @-mention picker for image_prompt ────────────────────────────────────
// Single shared floating popup (one DOM element). Typing '@' in any image_prompt
// textarea opens a filterable list of all cast entries; selecting one inserts
// the correct <id> token at the caret and manually syncs story state (a
// programmatic .value set does NOT fire 'change', so we do it explicitly).
let _mentionPop     = null;  // the #mention-pop element
let _mentionActive  = null;  // {ta, page, atIdx} while open; null when closed
let _mentionHlIdx   = 0;     // keyboard-highlighted row index (-1 if nothing selectable)
let _mentionItems   = [];    // current filtered cast entries
let _mentionBlocked = [];    // PER-97: index-aligned with _mentionItems — true =
                              // character-lane full, row shown but not selectable

function _initMentionPop() {
  _mentionPop = document.createElement('div');
  _mentionPop.id = 'mention-pop';
  document.body.appendChild(_mentionPop);
  // Close on click outside (capture phase so it fires before focus shifts)
  document.addEventListener('mousedown', e => {
    if (_mentionPop && !_mentionPop.contains(e.target)) _hideMentionPop();
  }, true);
}

function _hideMentionPop() {
  if (_mentionPop) _mentionPop.style.display = 'none';
  _mentionActive  = null;
  _mentionItems   = [];
  _mentionBlocked = [];
  _mentionHlIdx   = 0;
}

function _showMentionPop(ta, page, atIdx, query, container) {
  if (!_mentionPop) return;
  const q = (query || '').toLowerCase();
  const cast = (story && story.cast) || [];
  const items = cast.filter(c => c.id && (
    c.id.includes(q) || (c.name || '').toLowerCase().includes(q)
  ));
  if (!items.length) { _hideMentionPop(); return; }

  // PER-97: a character-kind row is blocked when the page's character lane is
  // already at its hard cap AND this id isn't already on the page — re-mentioning
  // an id already in page.cast is a no-op for the count (_castIdsFromPrompt
  // dedupes by first appearance), so it must stay selectable. Object/location
  // rows ride a different lane and are never blocked here.
  const { characters } = pageRefLaneCounts(page);
  const charCap = CHARACTER_LANE_CAP[PRO_IMAGE_MODEL] ?? MAX_CHARACTER_LANE;
  const laneFull = characters >= charCap;
  const onPage = new Set(page.cast || []);
  const blocked = items.map(c =>
    laneFull && (c.kind || 'character') === 'character' && !onPage.has(c.id)
  );

  _mentionActive  = { ta, page, atIdx, container };
  _mentionItems   = items;
  _mentionBlocked = blocked;
  _mentionHlIdx   = blocked.indexOf(false);  // first selectable row; -1 if none

  const rowsHtml = items.map((c, idx) => {
    const kind = c.kind || 'character';
    const cls = blocked[idx] ? 'mention-row blocked' : 'mention-row';
    return `<div class="${cls}" data-idx="${idx}">` +
      icon(kindIconName(kind), 'mi-sm') +
      `<span class="m-name">${esc(c.name || c.id)}</span>` +
      `<span class="m-kind">${esc(kind)}</span>` +
      `<span class="m-id">&lt;${esc(c.id)}&gt;</span>` +
      `</div>`;
  }).join('');
  const noteHtml = laneFull
    ? `<div class="mention-note">Character lane full — ${charCap} characters max per page. ` +
      `Remove a character mention to add another. Objects and places are unaffected.</div>`
    : '';
  _mentionPop.innerHTML = rowsHtml + noteHtml;

  _mentionPop.querySelectorAll('.mention-row').forEach(row => {
    if (row.classList.contains('blocked')) return;  // inert — no click handler
    row.addEventListener('pointerdown', e => {
      e.preventDefault(); // prevent textarea blur so we can set selection
      const idx = parseInt(row.dataset.idx, 10);
      _selectMentionItem(idx);
    });
  });

  _mentionHlUpdate();

  // Position anchored below the textarea (avoids covering the text being typed)
  const rect = ta.getBoundingClientRect();
  _mentionPop.style.left    = `${rect.left}px`;
  _mentionPop.style.top     = `${rect.bottom + 4}px`;
  _mentionPop.style.display = 'block';
}

function _mentionHlUpdate() {
  if (!_mentionPop) return;
  _mentionPop.querySelectorAll('.mention-row').forEach((row, i) => {
    row.classList.toggle('hl', i === _mentionHlIdx);
  });
}

// PER-97: walk from `from` in direction `dir` (+1/-1), skipping blocked rows.
// Clamps like the pre-PER-97 Math.min/max nav (no wraparound) — returns `from`
// unchanged when there is no further selectable row that way, including when
// nothing is selectable at all (from === -1).
function _mentionNextIdx(from, dir) {
  for (let i = from + dir; i >= 0 && i < _mentionItems.length; i += dir) {
    if (!_mentionBlocked[i]) return i;
  }
  return from;
}

function _selectMentionItem(idx) {
  if (!_mentionActive || !_mentionPop) return;
  if (_mentionBlocked[idx]) return;  // defensive — should be unreachable (no handler wired)
  const { ta, page, atIdx, container } = _mentionActive;
  const item = _mentionItems[idx];
  if (!item) return;

  const before = ta.value.slice(0, atIdx);
  const after  = ta.value.slice(ta.selectionStart);
  const insert = `<${item.id}> `;
  ta.value = before + insert + after;

  // Restore caret to end of inserted token
  const pos = before.length + insert.length;
  ta.setSelectionRange(pos, pos);

  // Must sync state manually — programmatic .value set does NOT fire 'change',
  // and clicking a row does not blur the textarea, so the existing 'change'
  // handler won't run. Mirror the prompt 'change' handler explicitly.
  page.image_prompt = ta.value;
  _syncPageCast(page, container);  // derive "Cast on this page" from the prompt
  markDirty(page, 'image_prompt');
  // Cancel the auto-save debounce markDirty just armed — saving mid-type
  // causes fields to lose focus. Auto-save will fire naturally when the user
  // blurs the textarea (triggering the existing 'change' handler).
  clearTimeout(autoSaveTimer);

  ta.focus();
  _hideMentionPop();
}

// ── Derived page cast ─────────────────────────────────────────────────────
// The image_prompt is the SINGLE source of truth for a page's cast. The cast
// is exactly the set of valid <id> tokens mentioned in the prompt, in order of
// first appearance. "Cast on this page" is a read-only view of this — there is
// no separate add/remove UI. Hero = first character-kind id in that order.
function _castIdsFromPrompt(promptText) {
  const validIds = new Set((story.cast || []).filter(c => c.id).map(c => c.id));
  const seen = [];
  const re = /<([^<>]+)>/g;
  let m;
  while ((m = re.exec(promptText || ''))) {
    const tok = m[1];
    if (validIds.has(tok) && !seen.includes(tok)) seen.push(tok);
  }
  return seen;
}

function _syncPageCast(page, container) {
  const derived = _castIdsFromPrompt(page.image_prompt);
  const cur = page.cast || [];
  const same = derived.length === cur.length && derived.every((v, i) => v === cur[i]);
  if (!same) page.cast = derived;           // page.cast is required by the schema
  if (container) renderPageCast(container, page);
  // Ref count depends on page.cast — refresh every page's ref badge (mirrors markDirty).
  document.querySelectorAll('[data-page-refbadge]').forEach(el => {
    const idx = parseInt(el.dataset.pageRefbadge, 10);
    const p = story.pages && story.pages[idx];
    if (p) updateRefBadge(el, p);
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  paintIcon(document.getElementById('brand-icon'), 'auto_stories_fill');
  paintIcon(document.getElementById('save-state-icon'), 'cloud_done');
  try {
    const [storyResp, schemaResp, statusResp] = await Promise.all([
      fetch('/api/story'),
      fetch('/api/schema'),
      fetch('/api/status'),
    ]);
    story  = await storyResp.json();
    schema = await schemaResp.json();
    window._schema = schema;
    storyMtime = storyResp.headers.get('X-Story-Mtime');
    const status = await statusResp.json();
    applyStatus(status);
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<p class="load-error">Failed to load: ${e.message}</p>`;
    return;
  }
  document.title = (story.title || 'Untitled') + ' — Storybook Editor';
  document.getElementById('header-title').textContent = story.title || 'Untitled';
  renderAll();

  // Resume a regenerate-all run that was started before this page load.
  try {
    const raResp = await fetch('/api/regenerate-all/status');
    const raData = await raResp.json();
    if (raData.ok && raData.status === 'running') {
      _regenAllRunning = true;
      const btn = document.getElementById('btn-regen-all');
      if (btn) { btn.disabled = true; btn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Re-generating…'; }
      _regenAllPoll = setInterval(_refreshRegenAllStatus, 2000);
    }
  } catch (_) { /* non-fatal: editor still usable */ }
}

// ── Dirty tracking ─────────────────────────────────────────────────────────
// field: the story.json key that changed (e.g. 'text', 'image_prompt', 'cast').
// Pass field=null or omit to mark as "unknown change" → conservative paid path.
function markDirty(pageObj, field) {
  unsavedChanges = true;
  if (pageObj) {
    dirtyPages.add(pageObj);
    editedPages.add(pageObj);
    // Track which field changed for fast-path eligibility.
    const key = field || '*';  // '*' = unknown → not in PILLOW_FIELDS → paid
    if (!editedFields.has(pageObj)) editedFields.set(pageObj, new Set());
    editedFields.get(pageObj).add(key);
    updateRegenButtons(pageObj.page_num);
  } else if (field === 'fonts') {
    // Book-level fonts map change affects every page's composite.
    (story.pages || []).forEach(p => {
      editedPages.add(p);
      if (!editedFields.has(p)) editedFields.set(p, new Set());
      editedFields.get(p).add('font');
      updateRegenButtons(p.page_num);
    });
  } else if (!field || !NEUTRAL_BOOK_FIELDS.has(field)) {
    // Any render-affecting book-level edit (style_guide, model, text_mode, resolution,
    // aspect_ratio, …) disables the fast path for all pages for this session.
    bookPaidEdit = true;
    // Refresh all regen buttons so the paid button re-appears everywhere.
    (story.pages || []).forEach(p => updateRegenButtons(p.page_num));
  }
  updateDirtyUi();
  // Refresh badges live
  document.querySelectorAll('[data-page-badge]').forEach(el => {
    const idx = parseInt(el.dataset.pageBadge, 10);
    const page = story.pages && story.pages[idx];
    if (page) updatePageBadge(el, page);
  });
  document.querySelectorAll('[data-page-refbadge]').forEach(el => {
    const idx = parseInt(el.dataset.pageRefbadge, 10);
    const page = story.pages && story.pages[idx];
    if (page) updateRefBadge(el, page);
  });
  // Auto-save debounce (skip if paused after a 409)
  if (!autoSavePaused) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => triggerSave(true), 1500);
  }
}
function clearDirty() {
  unsavedChanges = false;
  dirtyPages.clear();
  document.getElementById('dirty-dot').title = 'Unsaved changes';
  updateDirtyUi();
}
function updateDirtyUi() {
  const has = unsavedChanges;
  document.getElementById('dirty-dot').classList.toggle('visible', has);
}

// ── Helpers: enum lists from schema ───────────────────────────────────────
function enumFor(key) {
  const sp = schema.properties;
  if (sp[key] && sp[key].enum) return sp[key].enum;
  if (sp.pages && sp.pages.items && sp.pages.items.properties[key])
    return sp.pages.items.properties[key].enum || [];
  return [];
}
function defaultFor(key) {
  const sp = schema.properties;
  if (sp[key] && sp[key].default !== undefined) return sp[key].default;
  if (sp.pages && sp.pages.items && sp.pages.items.properties[key])
    return sp.pages.items.properties[key].default;
  return undefined;
}

// ── Binding helpers ────────────────────────────────────────────────────────
// All bindings write into the live object on change — no re-render on keystroke.

function bindText(el, obj, key, opts = {}) {
  el.value = obj[key] !== undefined ? obj[key] : '';
  const handler = () => {
    const v = el.value;
    if (opts.optional && v === '') {
      delete obj[key];
    } else {
      obj[key] = v;
    }
    if (opts.onchange) opts.onchange(v);
    markDirty(opts.page || null, key);
  };
  el.addEventListener('change', handler);
  if (opts.oninput) el.addEventListener('input', opts.oninput);
}

function makeSelect(opts, labelOverride) {
  return opts.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}

function bindEnum(el, obj, key, enumVals, opts = {}) {
  const absent = obj[key] === undefined;
  const dflt   = opts.defaultVal !== undefined ? opts.defaultVal : defaultFor(key);
  if (opts.optional) {
    const label = dflt !== undefined ? `— unset (default: ${dflt}) —` : '— unset —';
    el.insertAdjacentHTML('afterbegin', `<option value="">  ${esc(label)}</option>`);
  }
  enumVals.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  });
  if (opts.optional && absent) {
    el.value = '';
    el.classList.add('unset');
  } else {
    el.value = obj[key] || '';
  }
  el.addEventListener('change', () => {
    if (opts.optional && el.value === '') {
      delete obj[key];
      el.classList.add('unset');
    } else {
      obj[key] = el.value;
      el.classList.remove('unset');
    }
    if (opts.onchange) opts.onchange(el.value);
    markDirty(opts.page || null, key);
  });
}

// ── Conditional field relevance (PER-48) ──────────────────────────────────
// Effective text mode for a page: page override → book field → schema default.
const effMode = (page) =>
  (page && page.text_mode) || story.text_mode || defaultFor('text_mode') || 'native';
// True if any page's effective mode is long (shared text-bg is consumed by those pages).
const anyLong = () => {
  const ps = story.pages || [];
  return ps.length ? ps.some(p => effMode(p) === 'long') : effMode(null) === 'long';
};

// Dependency rules map: data-dep attribute value → { relevant(page), note(page), options? }
// Each entry controls one field wrapper that carries a matching data-dep attribute.
const FIELD_DEPS = {
  // Book-level text_background_prompt — only consumed when some page renders in long mode.
  'book-text-bg': {
    relevant: () => anyLong(),
  },
  // Page-level text_background_prompt — only meaningful in long mode.
  'page-text-bg': {
    relevant: (page) => effMode(page) === 'long',
  },
  // Page text_placement — no text band on long-mode body pages; cover is always relevant.
  'page-placement': {
    relevant: (page) => effMode(page) !== 'long' || page.page_num === 1,
    // 'floating' is only meaningful in native mode; in overlay/long it degrades to bottom.
    options: { floating: (page) => effMode(page) === 'native' },
  },
};

// Apply dependency rules to [data-dep] wrappers inside rootEl.
// page: the page object for page-scoped rules; null for book-level.
function applyDeps(rootEl, page) {
  if (!rootEl) return;
  rootEl.querySelectorAll('[data-dep]').forEach(wrap => {
    const rule = FIELD_DEPS[wrap.dataset.dep];
    if (!rule) return;
    const ok = rule.relevant(page);
    wrap.classList.toggle('dep-hidden', !ok);
    if (rule.options) {
      const sel = wrap.querySelector('select');
      if (!sel) return;
      for (const [val, cond] of Object.entries(rule.options)) {
        const opt = [...sel.options].find(o => o.value === val);
        if (!opt) continue;
        const on = cond(page);
        opt.disabled = !on;
        // Hard-hide unless it is the currently selected value (avoid silent data loss).
        opt.hidden = !on && sel.value !== val;
      }
    }
  });
}

// ── esc ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Collapse toggle ────────────────────────────────────────────────────────
function toggleSection(bodyId, toggleEl) {
  const body = document.getElementById(bodyId);
  const open = body.classList.toggle('collapsed');
  // The chevron is one icon rotated by CSS, not two glyphs.
  toggleEl.classList.toggle('collapsed', open);
}

// ── Palette swatches ───────────────────────────────────────────────────────
function hexFromPaletteStr(s) {
  const m = s.match(/#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g);
  return m ? m[m.length - 1] : null;
}
function updateSwatch(swatchEl, inputEl) {
  const hex = hexFromPaletteStr(inputEl.value);
  // No hex in the entry → fall back to the themed empty-swatch fill rather than
  // a hardcoded light grey, which read as a white disc in dark mode.
  swatchEl.style.background = hex || 'var(--surface-hover)';
  swatchEl.title = hex || 'no hex colour detected';
}

// ── saved_formats handling ─────────────────────────────────────────────────
// Unset ≠ [] in schema — unset means "all formats" (hint); [] means "no book files" (hint).
// No script reads this field; storybook-consolidate uses it as the default export answer.
function renderSavedFormats(container) {
  const sf = story.saved_formats; // may be undefined or array
  const isExplicit = sf !== undefined;
  container.innerHTML = `
    <div class="sf-toggle-row">
      <label>
        <input type="checkbox" id="sf-explicit" ${isExplicit ? 'checked' : ''}>

// ── Ref-image rows (string-or-array polymorphism) ──────────────────────────
function refList(char) {
  const r = char.ref_image;
  if (r === undefined) return [];
  return Array.isArray(r) ? r : [r];
}
function setRefList(char, arr) {
  if (arr.length === 0)      { delete char.ref_image; }
  else if (arr.length === 1) { char.ref_image = arr[0]; }
  else                       { char.ref_image = arr; }
}

function renderRefRows(container, char) {
  container.innerHTML = '';
  const list = refList(char);
  list.forEach((path, i) => {
    const row = document.createElement('div');
    row.className = 'ref-row';
    const imgSrc = `/img?path=${encodeURIComponent(path)}`;
    row.innerHTML =
      `<input type="text" value="${esc(path)}" placeholder="absolute or relative path to image">` +
      `<img class="ref-thumb" src="${esc(imgSrc)}" title="${esc(path)}">` +
      `<div class="ref-miss" title="File not found on disk">${icon('error', 'mi-sm')}</div>` +
      `<button class="btn-sm btn-danger" title="Remove reference">${icon('delete', 'mi-sm')}</button>`;
    const inp  = row.querySelector('input');
    const img  = row.querySelector('img');
    const miss = row.querySelector('.ref-miss');
    img.onerror = () => { img.style.display='none'; miss.style.display='flex'; };
    inp.addEventListener('change', () => {
      const arr = refList(char);
      arr[i] = inp.value;
      setRefList(char, arr);
      img.src = `/img?path=${encodeURIComponent(inp.value)}`;
      img.style.display=''; miss.style.display='none';
      markDirty(null);
    });
    row.querySelector('button').addEventListener('click', () => {
      const arr = refList(char);
      arr.splice(i, 1);
      setRefList(char, arr);
      renderRefRows(container, char);
      markDirty(null);
    });
    container.appendChild(row);
  });
  const btn = document.createElement('button');
  btn.className = 'btn-sm btn-add';
  btn.innerHTML = icon('add', 'mi-sm') + ' Add reference image';
  btn.addEventListener('click', () => {
    const arr = refList(char);
    arr.push('');
    setRefList(char, arr);
    renderRefRows(container, char);
    markDirty(null);
  });
  container.appendChild(btn);
}

/** Kind → Material Symbol, matching the Stitch cast cards' avatar placeholders. */
function kindIconName(kind) {
  if (kind === 'location') return 'location_on';
  if (kind === 'object')   return 'category';
  return 'person';
}

function buildCharCard(char, i) {
  const card = document.createElement('div');
  card.className = 'card';
  // Stitch leads each cast card with a round thumbnail: the entry's first
  // reference photo where it has one, else a kind-typed placeholder.
  const thumb = (refList(char) || []).find(Boolean);
  const avatar = thumb
    ? `<img class="card-avatar" src="/img?path=${encodeURIComponent(thumb)}" alt="">`
    : `<span class="card-avatar-ph">${icon(kindIconName(char.kind))}</span>`;
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      ${avatar}
      <span class="card-title" id="char-title-${i}">${esc(char.name || '(no name)')}${char.kind && char.kind !== 'character' ? ' <span class="kind-badge">' + char.kind.toUpperCase().slice(0,3) + '</span>' : ''}</span>
      <span class="card-id">${esc(char.id || '—')}</span>
      <span class="spacer"></span>
      <button class="btn-sm btn-danger" onclick="deleteChar(event,${i})">${icon('delete', 'mi-sm')}</button>
      <span class="toggle">${icon('expand_more')}</span>
    </div>
    <div class="card-body open" id="char-body-${i}">
      <div class="field">
        <label>ID <small>(lowercase slug, stable key — set once; rename display name freely below)</small></label>
        <input type="text" id="char-id-${i}" value="${esc(char.id||'')}" placeholder="e.g. pip, major-oak" pattern="^[a-z][a-z0-9-]*$" class="mono">
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="char-name-${i}" value="${esc(char.name||'')}">
      </div>
      <div class="field">
        <label>Appearance (include exactly one outfit — it locks for the whole book)</label>
        <textarea rows="3" id="char-appearance-${i}">${esc(char.appearance||'')}</textarea>
      </div>
      <div class="field">
        <label>Persistent details <small>(optional — PER-87: a small accessory/prop the style sheet alone doesn't reliably hold, e.g. "dark baseball cap with sunglasses resting on the brim"; auto-appended on every page this entry is on, without touching image_prompt)</small></label>
        <input type="text" id="char-persistent-${i}" value="${esc(char.persistent_details||'')}">
      </div>
      <div class="field">
        <label>Kind</label>
        <select id="char-kind-${i}"></select>
      </div>
      <div class="field">
        <label>Reference images (absolute paths or relative to story.json)</label>
        <div id="char-refs-${i}"></div>
      </div>
      <div class="sheet-block">
        <div class="sheet-block-head">
          <span class="sheet-block-title">Style-sheet reference</span>
        </div>
        <div id="char-sheet-${i}"></div>
      </div>
    </div>`;

  const idInp   = card.querySelector(`#char-id-${i}`);
  const nameInp = card.querySelector(`#char-name-${i}`);
  const titleEl = card.querySelector(`#char-title-${i}`);
  idInp.addEventListener('change', () => {
    const newId = idInp.value.trim();
    char.id = newId;
    // Auto-fill name from id when name is still blank (convenience for new entries)
    if (!char.name && newId) {
      char.name = newId;
      nameInp.value = newId;
      titleEl.textContent = newId;
    }
    markDirty(null);
  });
  nameInp.addEventListener('change', () => {
    const newName = nameInp.value;
    char.name = newName;
    titleEl.textContent = newName || '(no name)';
    // Auto-fill id from name when id is still blank (slugify: lowercase, replace non-alnum with -)
    if (!char.id && newName) {
      const slug = newName.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (/^[a-z][a-z0-9-]*$/.test(slug)) {
        char.id = slug;
        idInp.value = slug;
      }
    }
    // No page.cast propagation: pages[].cast holds ids, not names. Renaming the
    // display name does not touch references — that's the whole point of PER-56.
    markDirty(null);
  });

  const appTa = card.querySelector(`#char-appearance-${i}`);
  appTa.addEventListener('change', () => { char.appearance = appTa.value; markDirty(null); });

  const persistentInp = card.querySelector(`#char-persistent-${i}`);
  persistentInp.addEventListener('change', () => {
    if (persistentInp.value === '') delete char.persistent_details;
    else char.persistent_details = persistentInp.value;
    markDirty(null);
  });

  const kindSel = card.querySelector(`#char-kind-${i}`);
  const kindEnum = kindOf => {
    const schema = window._schema;
    try { return schema.properties.cast.items.properties.kind.enum; } catch(_) { return ['character','object','location']; }
  };
  kindEnum().forEach(v => {

  renderRefRows(card.querySelector(`#char-refs-${i}`), char);
  renderSheetPreview(card.querySelector(`#char-sheet-${i}`), char, i);
  // Fetch sheet versions if sheet exists or a regen is running (enables resume after reload).
  const cid = char.id || '';
  const _csd = charStatusData[cid] || {};
  const _sheetRunning = _csd.regen && _csd.regen.status === 'running';
  if (char.style_sheet || _sheetRunning) {

    if (_sheetRunning && !_sheetPolls.has(cid)) {
      startSheetPoll(cid);
    }
  }
  return card;
}
