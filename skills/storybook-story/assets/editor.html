// Helper: find the current cast-array index for a given cast-member id.
function _sheetIdx(cid) {
  return (story.cast || []).findIndex(c => c.id === cid);
}

// Render the sheet version history UI for the given cast member id.
function _renderSheetVersionUI(cid, apiData) {
  const i = _sheetIdx(cid);
  if (i < 0) return;
  const area = document.getElementById(`sheet-versions-${i}`);
  if (!area) return;

  const vd = _sheetVersionData.get(cid);
  const versions = (apiData && apiData.versions) || (vd && vd.versions) || [];
  const viewIdx  = vd ? vd.viewIdx : 0;
  const regen    = (apiData && apiData.regen) || {};
  const char = (story.cast || [])[i];
  const name = (char && char.name) || cid || '(no name)';

  if (versions.length === 0) {
    area.innerHTML = '';
    _updateSheetRegenBtn(i, regen);
    return;
  }

  const v = versions[Math.min(viewIdx, versions.length - 1)];
  const n = versions.length;
  const buster = encodeURIComponent(v.mtime || '');
  const imgSrc = `/img?path=${encodeURIComponent(v.path)}&t=${buster}`;
  const cidJ   = JSON.stringify(cid);

  area.innerHTML =
    `<div class="preview-img-wrap">` +
    `<img class="sheet-ver-img" src="${esc(imgSrc)}" alt="${esc(name)} sheet v${viewIdx+1}"` +
    ` onerror="this.alt='image not found'">` +
    `<div class="preview-overlay">` +
    (v.in_use
      ? `<span class="inuse-badge">${icon('check_circle_fill', 'mi-sm')} Used in book</span>`
      : `<button class="btn-use-version" onclick="_clickSelectSheetVersion(${cidJ},'${esc(v.id)}')">Use in book</button>`) +
    `</div></div>` +
    (n > 1
      ? `<div class="preview-nav">` +
        `<button class="btn-sm" ${viewIdx <= 0 ? 'disabled' : ''} onclick="_prevSheetVersion(${cidJ})">${icon('chevron_left', 'mi-sm')} Prev</button>` +
        `<span class="ver-counter">${viewIdx + 1} / ${n}</span>` +
        `<button class="btn-sm" ${viewIdx >= n - 1 ? 'disabled' : ''} onclick="_nextSheetVersion(${cidJ})">Next ${icon('chevron_right', 'mi-sm')}</button>` +
        `</div>`
      : '') +
    (regen.status === 'error'
      ? `<div class="regen-error">${icon('error', 'mi-sm')} Generation failed:<pre>${esc((regen.error || '').slice(-400))}</pre></div>`
      : '');

  _updateSheetRegenBtn(i, regen);
}

function _updateSheetRegenBtn(i, regen) {
  const btn = document.getElementById(`btn-sheet-regen-${i}`);
  const statusEl = document.getElementById(`sheet-regen-status-${i}`);
  if (!btn) return;
  const char = (story.cast || [])[i];
  const hasSheet = char && !!char.style_sheet;
  const status = regen && regen.status;
  if (status === 'running') {
    btn.disabled = true;
    btn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Generating…';
    if (statusEl) statusEl.textContent = 'generating…';
  } else {
    btn.disabled = false;
    btn.innerHTML = icon('refresh', 'mi-sm') + (hasSheet ? ' Regenerate sheet (paid)' : ' Generate sheet (paid)');
    if (statusEl) statusEl.textContent = '';
  }
}

// Fetch /api/sheet/versions for the given cast id, cache, and update UI.
async function fetchSheetVersions(cid) {
  try {
    const resp = await fetch(`/api/sheet/versions?id=${encodeURIComponent(cid)}`);
    const data = await resp.json();
    if (!data.ok) return;

    const versions = data.versions || [];
    const prev = _sheetVersionData.get(cid);
    const prevIdx = prev ? prev.viewIdx : -1;
    const inUseIdx = versions.findIndex(v => v.in_use);
    let viewIdx = inUseIdx >= 0 ? inUseIdx : 0;
    if (prevIdx >= 0 && prevIdx < versions.length) viewIdx = prevIdx;
    _sheetVersionData.set(cid, {versions, viewIdx});

    _renderSheetVersionUI(cid, data);

    // Stop poll on terminal status; resync story state on done.
    const status = data.regen && data.regen.status;
    if (_sheetPolls.has(cid) && (status === 'done' || status === 'error')) {
      stopSheetPoll(cid);
      if (status === 'done') {
        // Patch story.cast[i].style_sheet and update storyMtime so the next save
        // uses the fresh mtime written by make_style_sheet.py.
        try {
          const stResp = await fetch('/api/story');
          const newMtime = stResp.headers.get('X-Story-Mtime');
          const newStory = await stResp.json();
          const i2 = _sheetIdx(cid);
          if (i2 >= 0 && story.cast && story.cast[i2]) {
            const newEntry = (newStory.cast || []).find(e => e.id === cid);
            if (newEntry) story.cast[i2].style_sheet = newEntry.style_sheet;
          }
          if (newMtime) storyMtime = newMtime;
        } catch (e) {
          console.warn('fetchSheetVersions: story resync failed', e);
        }
        // Refresh charStatusData (keyed by id) + cost readout — a sheet regen is paid.
        try {
          const sr = await fetch('/api/status');
          const sd = await sr.json();
          applyStatus(sd);
        } catch (_) {}
        // Re-render the sheet preview for this cast entry only.
        const i3 = _sheetIdx(cid);
        if (i3 >= 0) {
          const sheetEl = document.getElementById(`char-sheet-${i3}`);
          if (sheetEl) renderSheetPreview(sheetEl, story.cast[i3], i3);
        }
      }
    }
  } catch (e) {
    console.warn('fetchSheetVersions failed for', cid, e);
  }
}

function startSheetPoll(cid) {
  stopSheetPoll(cid);
  _sheetPolls.set(cid, setInterval(() => fetchSheetVersions(cid), 2000));
}
function stopSheetPoll(cid) {
  if (_sheetPolls.has(cid)) {
    clearInterval(_sheetPolls.get(cid));
    _sheetPolls.delete(cid);
  }
}

// Arrow navigation through the sheet version list.
function _prevSheetVersion(cid) {
  const vd = _sheetVersionData.get(cid);
  if (!vd || vd.viewIdx <= 0) return;
  vd.viewIdx--;
  _renderSheetVersionUI(cid, {versions: vd.versions, regen: null});
}
function _nextSheetVersion(cid) {
  const vd = _sheetVersionData.get(cid);
  if (!vd || vd.viewIdx >= vd.versions.length - 1) return;
  vd.viewIdx++;
  _renderSheetVersionUI(cid, {versions: vd.versions, regen: null});
}

// "Use in book" for sheets: POST /api/sheet/select then refresh UI.
async function _clickSelectSheetVersion(cid, versionId) {
  try {
    const resp = await fetch('/api/sheet/select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: cid, version: versionId}),
    });
    const data = await resp.json();
    if (!data.ok) {
      alert('Could not select sheet version: ' + (data.error || 'unknown error'));
      return;
    }
    const versions = data.versions || [];
    const cur = _sheetVersionData.get(cid);
    _sheetVersionData.set(cid, {versions, viewIdx: cur ? cur.viewIdx : 0});
    _renderSheetVersionUI(cid, data);
  } catch (e) {
    alert('Network error while selecting sheet version: ' + e.message);
  }
}

// Regenerate/generate button handler for a cast entry's style sheet.
async function doSheetRegenerate(i) {
  const char = (story.cast || [])[i];
  if (!char) return;
  const cid  = char.id || '';
  const name = char.name || cid || '(no name)';
  const hasVersions = (_sheetVersionData.get(cid) || {}).versions?.length > 0;
  const msg = hasVersions
    ? `Regenerate style sheet for "${name}"?\n\n` +
      `This generates a new sheet (1 paid call — gpt-image-2).\n` +
      `The current sheet is archived to history.\n\n` +
      `Pages using "${name}" will NOT re-render automatically — re-render them separately if needed.`
    : `Generate style sheet for "${name}"?\n\n` +
      `This generates the sheet (1 paid call — gpt-image-2).\n\n` +
      `Pages using "${name}" will NOT render automatically — render them from the Pages section.`;
  if (!await customConfirm(msg, 'sheet-regen')) return;

  // Flush pending save so make_style_sheet.py reads the latest story.json.
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try again.');
      return;
    }
  }

  const btn = document.getElementById(`btn-sheet-regen-${i}`);
  const statusEl = document.getElementById(`sheet-regen-status-${i}`);
  if (btn)      { btn.disabled = true; btn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Generating…'; }
  if (statusEl) { statusEl.textContent = 'starting…'; }

  try {
    const resp = await fetch('/api/sheet/regenerate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: cid}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (btn)      { btn.disabled = false; btn.innerHTML = icon('refresh', 'mi-sm') + (char.style_sheet ? ' Regenerate sheet (paid)' : ' Generate sheet (paid)'); }
      if (statusEl) { statusEl.textContent = ''; }
      alert('Could not start sheet generation:\n\n' + (data.error || resp.statusText));
      return;
    }
    startSheetPoll(cid);
  } catch (e) {
    if (btn)      { btn.disabled = false; btn.innerHTML = icon('refresh', 'mi-sm') + (char.style_sheet ? ' Regenerate sheet (paid)' : ' Generate sheet (paid)'); }
    if (statusEl) { statusEl.textContent = ''; }
    alert('Network error: ' + e.message);
  }
}

async function deleteChar(evt, i) {
  evt.stopPropagation();
  const char = story.cast[i];
  const cid  = char.id || '';
  const name = char.name || cid || '(no name)';
  // Match by id (pages[].cast holds ids — PER-56); fall back to name for legacy files
  const usedOn = (story.pages || []).filter(p =>
    p.cast && (cid ? p.cast.includes(cid) : p.cast.includes(name)));
  if (usedOn.length > 0) {
    if (!await customConfirm(`"${name}" appears on ${usedOn.length} page(s). Delete anyway (will remove from those pages)?`))
      return;
    usedOn.forEach(p => {
      p.cast = p.cast.filter(n => n !== (cid || name));
      dirtyPages.add(p);
    });
  }
  story.cast.splice(i, 1);
  renderCast();
  renderPages(); // cast lists on pages change
  markDirty(null);
}

// ── Pages section ──────────────────────────────────────────────────────────
function renderPages() {
  const sec = document.getElementById('pages-body');
  sec.innerHTML = '';
  (story.pages || []).forEach((page, i) => {
    sec.appendChild(buildPageCard(page, i));
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.style.marginTop = '8px';
  addBtn.innerHTML = icon('add', 'mi-sm') + ' Add page';
  addBtn.addEventListener('click', () => {
    if (!story.pages) story.pages = [];
    story.pages.push({
      page_num: story.pages.length + 1,
      text: '',
      image_prompt: '',
      text_placement: 'floating',
      cast: [],
    });
    renderPages();
    markDirty(null);
  });
  sec.appendChild(addBtn);
  renderSidebarPages();
}

function updatePageBadge(badgeEl, page) {
  const num = page.page_num;
  const rs   = renderStatus[String(num)];
  const rendered = rs && rs.rendered;
  // Use editedPages (not dirtyPages) — amber persists after auto-save until page is re-rendered
  const edited   = editedPages.has(page);
  let cls = 'badge-render ';
  let txt = '';
  if (rendered && !edited)  { cls += 'rendered'; txt = 'rendered'; }
  else if (rendered && edited) { cls += 'edited';   txt = 'rendered · edited'; }
  else                      { cls += 'none';     txt = 'not rendered'; }
  badgeEl.className = cls;
  badgeEl.textContent = txt;
}

// Intent-based reference-image lane counts for a page (PER-83): references ride
// two independent lanes — a character lane (character-kind cast entries; sheet-only,
// no hero photo) and an object lane (object + location entries share one lane).
// Both lane caps are per-model (PER-96) — see OBJECT_LANE_CAP below. Matches the
// render-time split in collect_input_images / select_refs (render_book.py). No
// disk checks — this is a warning about full-render intent, computed client-side.
function pageRefLaneCounts(page) {
  const cast = page.cast || [];
  const castById = {};
  (story.cast || []).forEach(c => { if (c.id) castById[c.id] = c; });
  let characters = 0, objectLane = 0;
  cast.forEach(cid => {
    const c = castById[cid];
    const kind = c ? (c.kind || 'character') : 'character';
    if (kind === 'character') characters++;
    else objectLane++;
  });
  // PER-82: the book-wide style frame (if set and on disk) is attached to EVERY
  // page render as the lowest-priority object-lane ref, regardless of this
  // page's cast — mirrors collect_input_images, which sources it from `story`,
  // not `page`.
  if (story.style_frame && styleFrameExists) objectLane++;
  return { characters, objectLane };
}
const FLASH_IMAGE_MODEL = 'gemini-3.1-flash-image';
const PRO_IMAGE_MODEL = 'gemini-3-pro-image';
const CHARACTER_LANE_CAP = { [FLASH_IMAGE_MODEL]: 4, [PRO_IMAGE_MODEL]: 5 };
const MAX_CHARACTER_LANE = 4;
// PER-96: the object-lane cap is per-model, not one flat 10 — Pro's documented
// envelope spends more of its 14 slots on the character lane and a 3-slot
// style-reference lane we don't use yet, leaving it a smaller object lane.
const OBJECT_LANE_CAP = { [FLASH_IMAGE_MODEL]: 10, [PRO_IMAGE_MODEL]: 6 };
const MAX_OBJECT_LANE = 6;
const TOTAL_REF_CAP = 14;
function updateRefBadge(badgeEl, page) {
  const { characters, objectLane } = pageRefLaneCounts(page);
  const total = characters + objectLane;
  let effModel = (page.model) || story.model || defaultFor('model');
  // Mirror select_refs (render_book.py): the flash→pro auto-upgrade is decided
  // BEFORE the object cap is resolved, since the upgrade changes which cap
  // applies — a page can gain a character and lose object-lane refs at once.
  const upgraded = effModel === FLASH_IMAGE_MODEL
    && characters > (CHARACTER_LANE_CAP[FLASH_IMAGE_MODEL] ?? MAX_CHARACTER_LANE);
  if (upgraded) effModel = PRO_IMAGE_MODEL;
  const charCap = CHARACTER_LANE_CAP[PRO_IMAGE_MODEL] ?? MAX_CHARACTER_LANE; // 5 — the hard ceiling
  const objCap = OBJECT_LANE_CAP[effModel] ?? MAX_OBJECT_LANE;
  if (characters > charCap || objectLane > objCap || total > TOTAL_REF_CAP) {
    badgeEl.className = 'badge-refs over';
    // PER-97: the character lane is now a hard cap — save is refused before
    // this state can reach story.json, so "refs will drop" would be wrong for
    // it. The object lane has no such block (see plan's Out of scope), so it
    // keeps the original drop-at-render wording.
    badgeEl.textContent = characters > charCap
      ? `${characters} characters > hard cap ${charCap} — save blocked`
      : `${objectLane} objects/locations > object-lane cap ${objCap} — refs will drop`;
    badgeEl.title = characters > charCap
      ? `Character lane hard cap is ${charCap} (Gemini 3 Pro's character-lane limit). Pages over this cap cannot be saved — remove a character mention in the image prompt (PER-97).`
      : `References ride two lanes: a character lane (4 flash / 5 pro) and an object lane (objects + locations, cap 10 flash / 6 pro — PER-96). The lowest-priority refs in the overflowing object lane are dropped at render and logged.`;
  } else if (upgraded) {
    badgeEl.className = 'badge-refs warn';
    badgeEl.textContent = '5 characters → pro required';
    badgeEl.title = 'Flash character-lane cap is 4. Render auto-upgrades this page to gemini-3-pro-image at runtime (story.json unchanged). No manual action needed. Note: pro\'s object-lane cap is smaller (6, not 10) — this upgrade can also drop object/location refs that would have fit on flash.';
  } else {
    badgeEl.className = 'badge-refs';
    badgeEl.textContent = '';
    badgeEl.title = '';
  }
}

/** Stitch labels pages "Page N: <blurb>". story.json has no page-title field,
 *  so the blurb is the opening of the page's own story text. */
function pageBlurb(page) {
  return String(page.text || '').replace(/\s+/g, ' ').trim().slice(0, 40);
}

function buildPageCard(page, i) {
  const card = document.createElement('div');
  card.className = 'card';
  const isFirst = i === 0;
  const isLast  = i === (story.pages || []).length - 1;
  const dirtyMarkup = dirtyPages.has(page)
    ? '<span class="badge-dirty visible">●</span>'
    : '<span class="badge-dirty">●</span>';
  const badgeId = `badge-${i}`;
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      <span class="card-title">Page ${page.page_num}${pageBlurb(page) ? ': ' + esc(pageBlurb(page)) : ''}</span>
      ${dirtyMarkup}
      <span class="spacer"></span>
      <span class="badge-render none" id="${badgeId}" data-page-badge="${i}"></span>
      <span class="badge-refs" id="badge-refs-${i}" data-page-refbadge="${i}"></span>
      ${isFirst ? '' : `<button class="btn-sm" title="Move up" onclick="movePage(event,${i},-1)">↑</button>`}
      ${isLast  ? '' : `<button class="btn-sm" title="Move down" onclick="movePage(event,${i},+1)">↓</button>`}
      <button class="btn-sm btn-danger" title="Delete page" onclick="deletePage(event,${i})">${icon('delete', 'mi-sm')}</button>
      <span class="toggle">${icon('expand_more')}</span>
    </div>
    <div class="card-body split-body open" id="page-body-${i}">
     <div class="page-split">
      <div class="page-art">
        <div class="pg-preview-wrap">
          <div id="pg-preview-${page.page_num}" class="preview-img-area"></div>
          <div class="preview-actions">
            <button class="btn-recomp" id="btn-recomp-${page.page_num}" style="display:none"
              onclick="doRecomposite(${page.page_num})">${icon('layers', 'mi-sm')} Re-composite (free)</button>
            <button class="btn-regen" id="btn-regen-${page.page_num}"
              onclick="doRegenerate(${page.page_num})">${icon('refresh', 'mi-sm')} Render</button>
            <span class="regen-status-inline" id="regen-status-${page.page_num}"></span>
          </div>
        </div>
      </div>
      <div class="page-fields">
      <div class="field">
        <label>Text (story text on this page; empty for wordless/cover)</label>
        <textarea rows="3" id="pg-text-${i}">${esc(page.text||'')}</textarea>
      </div>
      <div class="field">
        <label>Image prompt (name characters + style; no safe-zone language)</label>
        <textarea rows="3" id="pg-prompt-${i}" placeholder="Type @ to mention cast, objects or locations…">${esc(page.image_prompt||'')}</textarea>
      </div>
      <div class="field">
        <label>Cast on this page</label>
        <div id="pg-cast-${i}" class="cast-section"></div>
      </div>
      <div class="grid3">
        <div class="field" data-dep="page-placement">
          <label>Text placement</label>
          <select id="pg-placement-${i}"></select>
        </div>
        <div class="field">
          <label>Text align</label>
          <select id="pg-align-${i}"></select>
        </div>
        <div class="field">
          <label>Font</label>
          <select id="pg-font-${i}"></select>
        </div>
      </div>
      <div class="field field-narrow">
        <label>Text colour</label>
        <select id="pg-colorhint-${i}"></select>
      </div>
      <div class="field" data-dep="page-text-bg">
        <label>Text page background prompt <small>(long mode only; blank = use the book's shared text-page background; set to generate a dedicated background for this page via an extra paid call)</small></label>
        <input type="text" id="pg-textbgprompt-${i}" placeholder="e.g. a misty forest path at dawn, soft light filtering through leaves">
      </div>
      <div class="grid2">
        <div class="field">
          <label>Text mode <small>(unset = same as book)</small></label>
          <select id="pg-textmode-${i}"></select>
        </div>
        <div class="field">
          <label>Image model <small>(unset = same as book)</small></label>
          <select id="pg-model-${i}"></select>
        </div>
      </div>
      <div class="field field-narrow">
        <label>Scene text <small>(unset = same as book)</small></label>
        <select id="pg-scenetext-${i}"></select>
      </div>
      </div>
     </div>
    </div>`;

  // Badges
  updatePageBadge(card.querySelector(`#${badgeId}`), page);
  updateRefBadge(card.querySelector(`#badge-refs-${i}`), page);

  // Text / prompt
  const textTa   = card.querySelector(`#pg-text-${i}`);
  const promptTa = card.querySelector(`#pg-prompt-${i}`);
  const castContainer = card.querySelector(`#pg-cast-${i}`);
  textTa.addEventListener('change', () => { page.text = textTa.value; markDirty(page, 'text'); });
  promptTa.addEventListener('change', () => {
    page.image_prompt = promptTa.value;
    _syncPageCast(page, castContainer);  // image_prompt is the single source of cast
    markDirty(page, 'image_prompt');
  });

  // @-mention picker: typing '@' opens a filterable cast-id dropdown.
  promptTa.addEventListener('input', () => {
    // Commit live so the read-only "Cast on this page" list mirrors the <id>
    // tokens as they're typed/deleted. No markDirty here — the 'change'
    // handler (on blur) is the save point, so we never auto-save mid-type.
    page.image_prompt = promptTa.value;
    _syncPageCast(page, castContainer);

    const pos    = promptTa.selectionStart;
    const before = promptTa.value.slice(0, pos);
    // Scan left from caret for a bare '@'; stop at whitespace or '>' (which
    // closes an existing <id> token) — no trigger inside an existing token.
    let atIdx = -1;
    for (let k = before.length - 1; k >= 0; k--) {
      const ch = before[k];
      if (ch === '@') { atIdx = k; break; }
      if (/[\s>]/.test(ch)) break;
    }
    if (atIdx >= 0) {
      _showMentionPop(promptTa, page, atIdx, before.slice(atIdx + 1), castContainer);
    } else {
      _hideMentionPop();
    }
  });
  promptTa.addEventListener('keydown', e => {
    if (!_mentionActive || !_mentionPop || _mentionPop.style.display === 'none') return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _mentionHlIdx = _mentionNextIdx(_mentionHlIdx, 1);
      _mentionHlUpdate();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _mentionHlIdx = _mentionNextIdx(_mentionHlIdx, -1);
      _mentionHlUpdate();
    } else if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault();
      _selectMentionItem(_mentionHlIdx);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      _hideMentionPop();
    }
  });
  promptTa.addEventListener('blur', () => {
    // Delay so a mousedown on a mention row fires before we hide
    setTimeout(_hideMentionPop, 150);
  });

  // Selects
  bindEnum(card.querySelector(`#pg-placement-${i}`), page, 'text_placement',
    enumFor('text_placement'), { optional: true, page });
  bindEnum(card.querySelector(`#pg-align-${i}`), page, 'text_align',
    enumFor('text_align'), { optional: true, page });
  bindEnum(card.querySelector(`#pg-font-${i}`), page, 'font',
    enumFor('font'), { optional: true, page });
  // Text mode override — sentinel shows the inherited default (page → book → schema default).
  bindEnum(card.querySelector(`#pg-textmode-${i}`), page, 'text_mode',
    enumFor('text_mode'), { optional: true, page,
      defaultVal: story.text_mode || defaultFor('text_mode'),
      onchange: () => { applyDeps(card, page); applyDeps(document.getElementById('book-body'), null); } });

  // Model override — sentinel shows the inherited default (page → book → schema default).
  bindEnum(card.querySelector(`#pg-model-${i}`), page, 'model',
    enumFor('model'), { optional: true, page, defaultVal: story.model || defaultFor('model') });

  // Scene text override (PER-87) — sentinel shows the inherited default (page → book → schema default).
  bindEnum(card.querySelector(`#pg-scenetext-${i}`), page, 'scene_text',
    enumFor('scene_text'), { optional: true, page, defaultVal: story.scene_text || defaultFor('scene_text') });

  // Color hint — enum dropdown matching established sentinel-inherit pattern (PER-52)
  bindEnum(card.querySelector(`#pg-colorhint-${i}`), page, 'text_color_hint',
    enumFor('text_color_hint'), { optional: true, page });

  // Text page background prompt (long mode only)
  const bgPromptInp = card.querySelector(`#pg-textbgprompt-${i}`);
  bgPromptInp.value = page.text_background_prompt || '';
  bgPromptInp.addEventListener('change', () => {
    if (bgPromptInp.value === '') delete page.text_background_prompt;
    else page.text_background_prompt = bgPromptInp.value;
    markDirty(page, 'text_background_prompt');  // not Pillow-only: needs paid bg call
  });

  // Cast
  renderPageCast(card.querySelector(`#pg-cast-${i}`), page);

  // Apply field-dependency rules (PER-48).
  applyDeps(card, page);

  // Preview: if page is rendered or regen is in flight, populate the img area async.
  const _pnum = page.page_num;
  updateRegenButtons(_pnum);
  if (renderStatus[String(_pnum)]?.rendered || _regenPolls.has(_pnum)) {
    fetchVersions(_pnum);
  }

  return card;
}

// Read-only view of a page's cast. The cast is DERIVED from the <id> tokens in
// the image_prompt (see _syncPageCast / _castIdsFromPrompt) — the prompt is the
// single source of truth, so there is no add/remove/reorder UI here. To change
// the cast, edit the prompt (type @ to pick). Order follows first <id> mention;
// hero = first character-kind id in that order.
function renderPageCast(container, page) {
  container.innerHTML = '';
  const selected = page.cast || [];  // array of cast ids (PER-56), derived from prompt
  const castById = {};
  (story.cast || []).forEach(c => { if (c.id) castById[c.id] = c; });
  const kindOf = cid => { const c = castById[cid]; return c ? (c.kind || 'character') : 'character'; };
  const nameOf = cid => { const c = castById[cid]; return c ? (c.name || cid) : cid; };

  if (!selected.length) {
    const hint = document.createElement('div');
    hint.className = 'cast-empty';
    hint.textContent = 'No cast yet — type @ in the image prompt above to mention a character, object, or place.';
    container.appendChild(hint);
    return;
  }

  // Hero = first character-kind entry (not literal-first)
  const heroIdx = selected.findIndex(cid => kindOf(cid) === 'character');

  const listDiv = document.createElement('div');
  listDiv.className = 'cast-list';
  selected.forEach((cid, j) => {
    const entry = document.createElement('div');
    entry.className = 'cast-entry readonly';
    const isHero = j === heroIdx;
    const entryKind = kindOf(cid);
    const kindBadge = entryKind !== 'character'
      ? `<span class="kind-badge" title="${entryKind}">${entryKind.toUpperCase().slice(0,3)}</span>`
      : '';
    entry.innerHTML =
      icon(kindIconName(entryKind), 'mi-sm') +
      `<span>${esc(nameOf(cid))}${isHero ? '<span class="hero-badge" title="First character-kind entry — leads reference ordering on this page">HERO</span>' : ''}${kindBadge}</span>`;
    listDiv.appendChild(entry);
  });
  container.appendChild(listDiv);
}

function movePage(evt, i, dir) {
  evt.stopPropagation();
  const pages = story.pages;
  const j = i + dir;
  if (j < 0 || j >= pages.length) return;
  [pages[i], pages[j]] = [pages[j], pages[i]];
  renumberPages();
  renderPages();
}

function deletePage(evt, i) {
  evt.stopPropagation();
  const page = story.pages[i];
  dirtyPages.delete(page);
  editedPages.delete(page);
  editedFields.delete(page);  // clean up stale fast-path tracking
  story.pages.splice(i, 1);
  renumberPages();
  renderPages();
  markDirty(null);
}

function renumberPages() {
  (story.pages || []).forEach((page, i) => {
    const newNum = i + 1;
    if (page.page_num !== newNum) {
      page.page_num = newNum;
      unsavedChanges = true;
      dirtyPages.add(page);
      // page_num change is a render-affecting edit (page reorder)
      if (!editedFields.has(page)) editedFields.set(page, new Set());
      editedFields.get(page).add('page_num');
    }
  });
  updateDirtyUi();
}

// ── Card toggle ────────────────────────────────────────────────────────────
function toggleCard(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
  const tog = header.querySelector('.toggle');
  if (tog) tog.classList.toggle('collapsed', !body.classList.contains('open'));
}

    const imgSrc = `/img?path=${encodeURIComponent(story.style_frame)}`;

// ── Smart-regenerate button logic ──────────────────────────────────────────

// Returns true when all in-session edits for this page are Pillow-only and the
// server has confirmed the raw/art/bg prerequisite exists (fast.eligible).
// Conservative: unknown fields, native mode, and any render-affecting book edit
// all disable the fast path (current behavior = paid re-render).
function fastAvailable(num) {
  if (bookPaidEdit) return false;
  // text_mode absent → native (default) → no Pillow split
  const mode = story.text_mode;
  if (mode !== 'overlay' && mode !== 'long') return false;
  const page = (story.pages || []).find(p => p.page_num === num);
  if (!page) return false;
  const fields = editedFields.get(page);
  if (!fields || fields.size === 0) return false;
  if (![...fields].every(f => PILLOW_FIELDS.has(f))) return false;
  const serverFast = (_pageVersionData.get(num) || {}).fast;
  return !!(serverFast && serverFast.eligible);
}

// Central function: update both regen buttons for a given page_num.
// This is the ONLY place that sets labels/visibility so poll flicker is impossible.
function updateRegenButtons(num, regen) {
  const recompBtn = document.getElementById(`btn-recomp-${num}`);
  const regenBtn  = document.getElementById(`btn-regen-${num}`);
  const statusEl  = document.getElementById(`regen-status-${num}`);
  if (!regenBtn) return;

  const running  = regen ? regen.status === 'running' : (_regenPolls.has(num) || _regenAllRunning);
  const hasVers  = (_pageVersionData.get(num) || {}).versions?.length > 0;
  const fast     = !running && fastAvailable(num);

  if (running) {
    if (recompBtn) { recompBtn.style.display = 'none'; recompBtn.disabled = true; }
    regenBtn.disabled    = true;
    regenBtn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Rendering…';
    regenBtn.classList.remove('btn-regen-secondary');
    if (statusEl) statusEl.textContent = 'rendering…';
  } else if (fast) {
    if (recompBtn) { recompBtn.style.display = ''; recompBtn.disabled = false; }
    regenBtn.disabled    = false;
    regenBtn.innerHTML = icon('refresh', 'mi-sm') + ' Re-render (paid)';
    regenBtn.classList.add('btn-regen-secondary');
    if (statusEl) statusEl.textContent = '';
  } else {
    if (recompBtn) { recompBtn.style.display = 'none'; recompBtn.disabled = true; }
    regenBtn.disabled    = false;
    regenBtn.innerHTML = icon('refresh', 'mi-sm') + (hasVers ? ' Regenerate' : ' Render');
    regenBtn.classList.remove('btn-regen-secondary');
    if (statusEl) statusEl.textContent = '';
  }
}

// ── Page image preview + generation history ────────────────────────────────

// Render the preview img-area for a given page_num using cached version data
// and a (possibly partial) API payload.  Called from fetchVersions and from
// the arrow / select handlers.
function _renderVersionUI(num, apiData) {
  const area = document.getElementById(`pg-preview-${num}`);
  if (!area) return;

  const vd = _pageVersionData.get(num);
  const versions = (apiData && apiData.versions) || (vd && vd.versions) || [];
  const viewIdx  = vd ? vd.viewIdx : 0;
  const regen    = (apiData && apiData.regen) || {};

  if (versions.length === 0) {
    area.innerHTML = '';
    updateRegenButtons(num, regen);
    return;
  }

  const v    = versions[Math.min(viewIdx, versions.length - 1)];
  const n    = versions.length;
  const buster = encodeURIComponent(v.mtime || '');
  const imgSrc = `/img?path=${encodeURIComponent(v.path)}&t=${buster}`;
  // Long-mode body pages are two physical pages: art + a separate text page.
  // text_path is null for overlay/native pages and for the long-mode cover.
  const textSrc = v.text_path
    ? `/img?path=${encodeURIComponent(v.text_path)}&t=${buster}`
    : null;

  area.innerHTML =
    `<div class="preview-pair">` +
    `<div class="preview-img-wrap">` +
    `<img class="preview-img" src="${esc(imgSrc)}" alt="Page ${num} v${viewIdx+1}"` +
    ` onerror="this.alt='image not found on disk'">` +
    `<div class="preview-overlay">` +
    (v.in_use
      ? `<span class="inuse-badge">${icon('check_circle_fill', 'mi-sm')} Used in book</span>`
      : `<button class="btn-use-version" onclick="_clickSelectVersion(${num}, '${esc(v.id)}')">Use in book</button>`) +
    `</div></div>` +
    (textSrc
      ? `<div class="preview-img-wrap">` +
        `<img class="preview-img" src="${esc(textSrc)}" alt="Page ${num} text page"` +
        ` onerror="this.alt='text page not found on disk'">` +
        `<div class="preview-overlay"><span class="textpage-badge">text page</span></div>` +
        `</div>`
      : '') +
    `</div>` +
    (n > 1
      ? `<div class="preview-nav">` +
        `<button class="btn-sm" ${viewIdx <= 0 ? 'disabled' : ''} onclick="_prevVersion(${num})">${icon('chevron_left', 'mi-sm')} Prev</button>` +
        `<span class="ver-counter">${viewIdx + 1} / ${n}</span>` +
        `<button class="btn-sm" ${viewIdx >= n - 1 ? 'disabled' : ''} onclick="_nextVersion(${num})">Next ${icon('chevron_right', 'mi-sm')}</button>` +
        `</div>`
      : '') +
    (regen.status === 'error'
      ? `<div class="regen-error">${icon('error', 'mi-sm')} Render failed:<pre>${esc((regen.error || '').slice(-400))}</pre></div>`
      : '');

  // Delegate all button state to the central function (kills poll flicker)
  updateRegenButtons(num, regen);
}

// Fetch /api/versions for page_num, cache, and update the UI.
// Pure — does NOT mutate the canonical slot.
async function fetchVersions(num) {
  try {
    const resp = await fetch(`/api/versions?page=${num}`);
    const data = await resp.json();
    if (!data.ok) return;

    const versions = data.versions || [];
    const prev     = _pageVersionData.get(num);
    // Preserve the user's current scroll position in the history list.
    const prevIdx  = prev ? prev.viewIdx : -1;
    const inUseIdx = versions.findIndex(v => v.in_use);
    let viewIdx = inUseIdx >= 0 ? inUseIdx : 0;
    if (prevIdx >= 0 && prevIdx < versions.length) viewIdx = prevIdx;
    // Cache fast-path hint alongside version data.
    _pageVersionData.set(num, {versions, viewIdx, fast: data.fast});

    _renderVersionUI(num, data);

    // If a poll is running and the regen/recomposite just finished, stop polling and
    // update the page's render badge.
    const status = data.regen && data.regen.status;
    if (_regenPolls.has(num) && (status === 'done' || status === 'error')) {
      stopRegenPoll(num);
      // PER-35: a per-page regenerate is a paid call regardless of outcome (a
      // failed attempt can still have spent tokens before erroring) — refresh
      // the cost readout so it doesn't sit stale until the next save. A free
      // recomposite also passes through here; the extra /api/status fetch is
      // a harmless no-op cost-wise.
      try {
        const sr = await fetch('/api/status');
        const sd = await sr.json();
        if (sd.ok) applyStatus(sd);
      } catch (_) { /* non-fatal */ }
      if (status === 'done') {
        renderStatus[String(num)] = {rendered: true};
        const cardIdx = (story.pages || []).findIndex(p => p.page_num === num);
        if (cardIdx >= 0) {
          const p = story.pages[cardIdx];
          editedPages.delete(p);
          editedFields.delete(p);  // clear fast-path tracking — composite applied
          const badgeEl = document.querySelector(`[data-page-badge="${cardIdx}"]`);
          if (badgeEl) updatePageBadge(badgeEl, p);
        }
        updateRegenButtons(num, data.regen);
      }
    }
  } catch (e) {
    console.warn('fetchVersions failed for page', num, e);
  }
}

function startRegenPoll(num) {
  stopRegenPoll(num);
  _regenPolls.set(num, setInterval(() => fetchVersions(num), 2000));
}
function stopRegenPoll(num) {
  if (_regenPolls.has(num)) {
    clearInterval(_regenPolls.get(num));
    _regenPolls.delete(num);
  }
}

// Arrow navigation through the version list.
function _prevVersion(num) {
  const vd = _pageVersionData.get(num);
  if (!vd || vd.viewIdx <= 0) return;
  vd.viewIdx--;
  _renderVersionUI(num, {versions: vd.versions, regen: null});
}
function _nextVersion(num) {
  const vd = _pageVersionData.get(num);
  if (!vd || vd.viewIdx >= vd.versions.length - 1) return;
  vd.viewIdx++;
  _renderVersionUI(num, {versions: vd.versions, regen: null});
}

// "Use in book" button: POST /api/page/select then refresh UI.
async function _clickSelectVersion(num, versionId) {
  try {
    const resp = await fetch('/api/page/select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num, version: versionId}),
    });
    const data = await resp.json();
    if (!data.ok) {
      alert('Could not select version: ' + (data.error || 'unknown error'));
      return;
    }
    const versions = data.versions || [];
    const cur      = _pageVersionData.get(num);
    // Stay on the same position (now marked in_use).
    _pageVersionData.set(num, {versions, viewIdx: cur ? cur.viewIdx : 0});
    _renderVersionUI(num, data);
  } catch (e) {
    alert('Network error while selecting version: ' + e.message);
  }
}

// Free re-composite handler: flush save → POST recomposite → poll.
// No confirm dialog — zero cost and the current image is archived first.
// On server 422 (prerequisite missing), offers a paid re-render fallback.
async function doRecomposite(num) {
  // Flush pending save so render_book.py reads the latest text fields.
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try re-compositing.');
      return;
    }
  }

  updateRegenButtons(num, {status: 'running'});  // show Rendering… immediately

  try {
    const resp = await fetch('/api/page/recomposite', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      updateRegenButtons(num);  // restore button state
      if (data.fallback) {
        // Prerequisite raw/art/bg is missing — offer paid fallback.
        if (await customConfirm(`Fast re-composite unavailable:\n${data.error || ''}\n\nRun a full paid re-render instead?`, 'page-regen')) {
          await doRegenerate(num);
        }
      } else {
        alert('Could not start re-composite:\n\n' + (data.error || resp.statusText));
      }
      return;
    }
    startRegenPoll(num);
  } catch (e) {
    updateRegenButtons(num);
    alert('Network error: ' + e.message);
  }
}

// Regenerate button handler: confirm → flush save → POST regenerate → poll.
async function doRegenerate(num) {
  const n = (story.pages || []).find(p => p.page_num === num);
  const hasVersions = (_pageVersionData.get(num) || {}).versions?.length > 0;
  const msg = hasVersions
    ? `Regenerate page ${num}?\n\nThis generates a new image (one paid Gemini call).\nThe current image will be saved to history.`
    : `Render page ${num}?\n\nThis generates the image (one paid Gemini call).`;
  if (!await customConfirm(msg, 'page-regen')) return;

  // Flush pending auto-save so render_book.py reads the latest image_prompt.
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try regenerating.');
      return;
    }
  }

  const btn      = document.getElementById(`btn-regen-${num}`);
  const statusEl = document.getElementById(`regen-status-${num}`);
  if (btn)      { btn.disabled = true; btn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Rendering…'; }
  if (statusEl) { statusEl.textContent = 'starting…'; }

  try {
    const resp = await fetch('/api/page/regenerate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (btn)      { btn.disabled = false; btn.innerHTML = icon('refresh', 'mi-sm') + (hasVersions ? ' Regenerate' : ' Render'); }
      if (statusEl) { statusEl.textContent = ''; }
      alert('Could not start render:\n\n' + (data.error || resp.statusText));
      return;
    }
    startRegenPoll(num);
  } catch (e) {
    if (btn)      { btn.disabled = false; btn.innerHTML = icon('refresh', 'mi-sm') + (hasVersions ? ' Regenerate' : ' Render'); }
    if (statusEl) { statusEl.textContent = ''; }
    alert('Network error: ' + e.message);
  }
}

// ── Consolidate Story modal ────────────────────────────────────────────────
let _consolidatePoll = null;

function openConsolidateModal() {
  const dlg = document.getElementById('consolidate-modal');
  // Render the saved_formats tri-state into the modal's #sf-container.
  renderSavedFormats(document.getElementById('sf-container'));
  document.getElementById('cm-zip').checked = false;
  // Resume status poll if a consolidation job is already running.
  _refreshConsolidateStatus();
  dlg.showModal();
}

function closeConsolidateModal() {
  document.getElementById('consolidate-modal').close();
}

// Close on backdrop click (click whose target IS the dialog element itself).
document.addEventListener('DOMContentLoaded', () => {
  const dlg = document.getElementById('consolidate-modal');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    if (_consolidatePoll) { clearInterval(_consolidatePoll); _consolidatePoll = null; }
  });
});

async function runConsolidate() {
  // Compute effective formats from the tri-state + zip toggle.
  const sf = story.saved_formats; // undefined | array
  const eff = sf === undefined ? ['pdf', 'epub'] : sf;   // unset = all; [] = none
  const formats = [...eff];
  if (document.getElementById('cm-zip').checked) formats.push('zip');

  if (!formats.length) {
    alert('Nothing to export. Enable at least one format in Saved formats, or check "also build zip".');
    return;
  }

  // Flush unsaved edits so the scripts read the latest story.json (including
  // any saved_formats change made inside this modal before clicking Run).
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try consolidating.');
      return;
    }
  }

  const runBtn = document.getElementById('cm-run');
  runBtn.disabled = true;
  runBtn.textContent = 'Running…';
  document.getElementById('cm-results').innerHTML = '';

  try {
    const resp = await fetch('/api/consolidate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({formats}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      runBtn.disabled = false;
      runBtn.textContent = 'Run';
      alert('Could not start consolidation:\n\n' + (data.error || resp.statusText));
      return;
    }
    _consolidatePoll = setInterval(_refreshConsolidateStatus, 1500);
  } catch (e) {
    runBtn.disabled = false;
    runBtn.textContent = 'Run';
    alert('Network error: ' + e.message);
  }
}

async function _refreshConsolidateStatus() {
  try {
    const resp = await fetch('/api/consolidate/status');
    if (!resp.ok) return;
    const data = await resp.json();

    // Render per-format results live.
    const resultsEl = document.getElementById('cm-results');
    if (resultsEl && data.results && data.results.length) {
      resultsEl.innerHTML = data.results.map(r => {
        if (r.ok) {
          return `<div class="cm-result-item cm-result-ok">${icon('check_circle_fill', 'mi-sm')} ${r.format}${r.path ? ` → <code>${r.path}</code>` : ''}</div>`;
        }
        return `<div class="cm-result-item cm-result-err">${icon('error', 'mi-sm')} ${r.format}` +
          (r.error ? `<div class="regen-error"><pre>${r.error.replace(/</g,'&lt;')}</pre></div>` : '') +
          `</div>`;
      }).join('');
    }

    // Stop polling on terminal states.
    if (data.status === 'done' || data.status === 'error') {
      if (_consolidatePoll) { clearInterval(_consolidatePoll); _consolidatePoll = null; }
      const runBtn = document.getElementById('cm-run');
      if (runBtn) { runBtn.disabled = false; runBtn.textContent = 'Run'; }
    }
  } catch (_) { /* network blip — keep polling */ }
}

// ── Re-generate all pages ─────────────────────────────────────────────────
async function doRegenerateAll() {
  const pages = story.pages || [];
  const n = pages.length;
  if (n === 0) { alert('No pages in story to render.'); return; }

  // Primary confirm: cost + history note + style-sheet reminder.
  const msg =
    `Re-generate all ${n} page${n === 1 ? '' : 's'}?\n\n` +
    `This makes ${n} paid Gemini call${n === 1 ? '' : 's'} (one per page) and replaces every ` +
    `page image. Current images are saved to history.\n\n` +
    `Note: style sheets are NOT regenerated — re-run Stage 2 first if you changed ` +
    `style_guide and want the sheets to reflect the new settings.`;
  if (!await customConfirm(msg, 'regen-all')) return;

  // Second confirm for long-mode books: shared bg may be stale.
  let fresh_bg = false;
  const hasLong = story.text_mode === 'long' ||
    pages.some(p => p.text_mode === 'long');
  if (hasLong) {
    fresh_bg = await customConfirm(
      'Also regenerate the text-page background?\n\n' +
      '+1 paid Gemini call (and +1 per page that has a dedicated background).\n\n' +
      'A style_guide change makes the old background stale — this replaces it. ' +
      'Cancel keeps the current background.',
      'regen-all-bg'
    );
  }

  // Flush unsaved edits so render_book.py reads the latest story.json.
  if (dirtyPages.size > 0) {
    await triggerSave(false);
    if (dirtyPages.size > 0) {
      alert('Please save your changes first, then try re-generating.');
      return;
    }
  }

  const btn = document.getElementById('btn-regen-all');
  const statusEl = document.getElementById('regen-all-status');
  if (btn) { btn.disabled = true; btn.innerHTML = icon('progress_activity', 'mi-sm mi-spin') + ' Re-generating…'; }
  if (statusEl) { statusEl.textContent = 'starting…'; }
  const errEl = document.getElementById('regen-all-error');
  if (errEl) { errEl.style.display = 'none'; errEl.innerHTML = ''; }

  try {
    const resp = await fetch('/api/regenerate-all', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fresh_bg}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (btn) { btn.disabled = false; btn.innerHTML = icon('autorenew', 'mi-sm') + ' Re-generate All Pages'; }
      if (statusEl) { statusEl.textContent = ''; }
      alert('Could not start re-generation:\n\n' + (data.error || resp.statusText));
      return;
    }

    // Mark all pages running and start the poll.
    _regenAllRunning = true;
    pages.forEach(p => updateRegenButtons(p.page_num, {status: 'running'}));
    _regenAllPoll = setInterval(_refreshRegenAllStatus, 2000);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.innerHTML = icon('autorenew', 'mi-sm') + ' Re-generate All Pages'; }
    if (statusEl) { statusEl.textContent = ''; }
    alert('Network error: ' + e.message);
  }
}

async function _refreshRegenAllStatus() {
  try {
    const resp = await fetch('/api/regenerate-all/status');
    if (!resp.ok) return;
    const data = await resp.json();

    // Update progress text.
    const statusEl = document.getElementById('regen-all-status');
    if (statusEl && data.status === 'running') {
      statusEl.textContent = `rendering… ${data.done}/${data.total}`;
    }

    // Terminal: done or error.
    if (data.status === 'done' || data.status === 'error') {
      if (_regenAllPoll) { clearInterval(_regenAllPoll); _regenAllPoll = null; }
      _regenAllRunning = false;

      const btn = document.getElementById('btn-regen-all');
      if (btn) { btn.disabled = false; btn.innerHTML = icon('autorenew', 'mi-sm') + ' Re-generate All Pages'; }
      if (statusEl) { statusEl.textContent = ''; }

      // Show aggregate error if any.
      const errEl = document.getElementById('regen-all-error');
      if (errEl && data.status === 'error' && data.error) {
        errEl.style.display = '';
        errEl.innerHTML = `${icon('error', 'mi-sm')} Re-generation failed:<pre>${esc(data.error.slice(-600))}</pre>`;
      }

      // Refresh global render status, cost readout, and all page badges.
      try {
        const srResp = await fetch('/api/status');
        const srData = await srResp.json();
        if (srData.ok) {
          applyStatus(srData);
          document.querySelectorAll('[data-page-badge]').forEach(el => {
            const idx = parseInt(el.dataset.pageBadge, 10);
            const page = story.pages && story.pages[idx];
            if (page) updatePageBadge(el, page);
          });
        }
      } catch (_) { /* non-fatal */ }

      // Clear per-page edit state for successfully rendered pages; update previews.
      const pages = story.pages || [];
      pages.forEach(p => {
        const num = p.page_num;
        const pageEntry = data.pages && data.pages[String(num)];
        if (pageEntry && pageEntry.status === 'done') {
          editedPages.delete(p);
          editedFields.delete(p);
        }
        // fetchVersions updates the preview panel, regen badge, and regen buttons.
        fetchVersions(num);
      });

      // Reset bookPaidEdit only when every page succeeded — all book-level edits applied.
      if (data.status === 'done') {
        bookPaidEdit = false;
        pages.forEach(p => updateRegenButtons(p.page_num));
      }
    }
  } catch (_) { /* network blip — keep polling */ }
}

// ── Full render ────────────────────────────────────────────────────────────
// App shell: a persistent left sidebar (Book / Cast / Pages nav + Consolidate /
// Re-generate All) beside a scrolling pane holding the three collapsible
// sections. All page cards stay mounted (card-body starts "open") — the
// sidebar's page rows scroll-to-anchor rather than swap the pane's contents.
function renderAll() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav">
        <a href="#sec-book" class="side-link" data-target="sec-book">${icon('menu_book')} Book</a>
        <a href="#sec-cast" class="side-link" data-target="sec-cast">${icon('groups')} Cast <span class="side-count" id="side-cast-count"></span></a>
        <div class="side-link side-pages-label" data-target="sec-pages">${icon('auto_stories_fill')} Pages</div>
        <div class="side-pages-list" id="side-pages-list"></div>
      </nav>
      <div class="side-footer">
        <button class="btn-outline btn-block" id="btn-regen-all" onclick="doRegenerateAll()">${icon('autorenew', 'mi-sm')} Re-generate All Pages</button>
        <button class="btn-primary btn-block" onclick="openConsolidateModal()">${icon('auto_fix_high', 'mi-sm')} Consolidate Story</button>
        <div id="regen-all-status-wrap" class="regen-all-status-wrap">
          <span id="regen-all-status"></span>
          <div id="regen-all-error" class="regen-error" style="display:none"></div>
        </div>
      </div>
    </aside>
    <div class="pane" id="pane">
      <section class="panel" id="sec-book">
        <h2 class="panel-head" onclick="toggleSection('book-body', this.querySelector('.toggle'))">
          <span class="panel-icon">${icon('book')}</span> Book settings <span class="toggle">${icon('expand_more')}</span>
        </h2>
        <div class="section-body" id="book-body"></div>
      </section>
      <section class="panel" id="sec-cast">
        <h2 class="panel-head" onclick="toggleSection('cast-body', this.querySelector('.toggle'))">
          <span class="panel-icon">${icon('groups')}</span> Cast <span class="panel-hint">(order determines hero on pages)</span>
          <span class="toggle">${icon('expand_more')}</span>
        </h2>
        <div class="section-body" id="cast-body"></div>
      </section>
      <section class="panel" id="sec-pages">
        <h2 class="panel-head" onclick="toggleSection('pages-body', this.querySelector('.toggle'))">
          <span class="panel-icon">${icon('auto_stories')}</span> Pages <span class="toggle">${icon('expand_more')}</span>
        </h2>
        <div class="section-body" id="pages-body"></div>
      </section>
    </div>`;
  renderBook();
  renderCast();
  renderPages(); // also populates the sidebar page list — see renderPages()
  _initScrollSpy();
}

// Sidebar "Pages" list — one row per page, scroll-anchored to that page's
// card body (id="page-body-${i}", already emitted by buildPageCard). Kept in
// sync from renderPages() so add/delete/reorder never leaves it stale.
function renderSidebarPages() {
  const list = document.getElementById('side-pages-list');
  const cc = document.getElementById('side-cast-count');
  if (cc) cc.textContent = String((story.cast || []).length);
  if (!list) return;
  list.innerHTML = '';
  (story.pages || []).forEach((page, i) => {
    const rs = renderStatus[String(page.page_num)];
    const row = document.createElement('a');
    row.href = `#page-body-${i}`;
    row.className = 'side-page-row';
    row.dataset.target = `page-body-${i}`;
    const blurb = pageBlurb(page).slice(0, 28);
    row.innerHTML =
      `<span class="side-page-name">Page ${page.page_num}${blurb ? ': ' + esc(blurb) : ''}</span>` +
      `<span class="side-dot${rs && rs.rendered ? ' rendered' : ''}"></span>`;
    row.title = `Page ${page.page_num}`;
    list.appendChild(row);
  });
}

// Scroll-spy: highlights the sidebar nav item for whichever top-level section
// is currently in view within the scrolling pane. Cosmetic only — no test
// depends on `.active`.
const SPY_SECTIONS = ['sec-book', 'sec-cast', 'sec-pages'];
let _spyHandler = null;
function _initScrollSpy() {
  const pane = document.getElementById('pane');
  if (_spyHandler) window.removeEventListener('resize', _spyHandler);
  if (!pane) return;
  // Deliberately NOT an IntersectionObserver: the Pages section is taller than
  // the pane, so no visible-ratio threshold ever fires for it. "Last section
  // whose top has passed the pane's top edge" is the behaviour actually wanted.
  const update = () => {
    const top = pane.getBoundingClientRect().top + 80;
    let current = SPY_SECTIONS[0];
    SPY_SECTIONS.forEach(id => {
      const el = document.getElementById(id);
      if (el && el.getBoundingClientRect().top <= top) current = id;
    });
    document.querySelectorAll('.side-link[data-target]').forEach(l => {
      l.classList.toggle('active', l.dataset.target === current);
    });
  };
  _spyHandler = update;
  pane.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
}

// Sidebar links/rows scroll their target into view within the pane instead of
// following the default document-level hash jump (the pane, not the document,
// is the scrolling region in the app shell).
document.addEventListener('click', e => {
  const link = e.target.closest('.side-link[data-target], .side-page-row[data-target]');
  if (!link) return;
  e.preventDefault();
  const target = document.getElementById(link.dataset.target);
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

// ── Save ───────────────────────────────────────────────────────────────────
// auto=true: quiet failures (no error panel spam); auto=false: loud (manual Save / Ctrl-S).
// 409 is always loud and pauses all future auto-saves until the page is reloaded.
async function triggerSave(auto = false) {
  // Nothing to save — timer may fire after a manual save beat it
  if (auto && !unsavedChanges) return;

  const btn = document.getElementById('btn-save');

  // Client-side pre-flight
  const localErrors = clientValidate();
  if (localErrors.length) {
    if (!auto) showStatus('error', localErrors);
    else       showAutoSaveHint(`unsaved · ${localErrors.length} error${localErrors.length > 1 ? 's' : ''}`);
    return;
  }

  // In-flight serialization: queue at most one pending save; prevents self-409
  if (saveInFlight) { savePending = true; return; }
  saveInFlight = true;

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const resp = await fetch('/api/story', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        ...(storyMtime ? {'X-Story-Mtime': storyMtime} : {}),
      },
      body: JSON.stringify(story),
    });
    const data = await resp.json();
    if (resp.status === 409) {
      // Always loud — concurrent writer (e.g. Stage 2 wrote style_sheet) — pause auto-save
      autoSavePaused = true;
      showStatus('error', [data.error + ' — click "Reload" to load the latest version.'], true);
      return;
    }
    if (resp.status === 422) {
      if (!auto) showStatus('error', data.errors.concat(data.warnings.map(w => '⚠ ' + w)));
      else       showAutoSaveHint('unsaved · validation error');
      return;
    }
    if (!resp.ok) {
      if (!auto) showStatus('error', [data.error || 'Unknown server error']);
      else       showAutoSaveHint('unsaved · server error');
      return;
    }
    storyMtime = data.mtime;
    clearDirty();
    hideAutoSaveHint();
    renderPages(); // refresh badges
    if (data.warnings && data.warnings.length) {
      showStatus('warn', data.warnings.map(w => '⚠ ' + w));
    } else if (!auto) {
      hideStatus();
    }
    // Refetch status after save (style_sheet / style_frame may now exist)
    const sr = await fetch('/api/status');
    const sd = await sr.json();
    applyStatus(sd);
    renderPages();
  } catch (e) {
    if (!auto) showStatus('error', ['Network error: ' + e.message]);
    else       showAutoSaveHint('unsaved · network error');
  } finally {
    saveInFlight = false;
    btn.disabled = false;
    btn.textContent = 'Save';
    // Drain the queue: one pending save at most
    if (savePending) { savePending = false; triggerSave(auto); }
  }
}

function clientValidate() {
  const errors = [];
  const required = (schema.required || []);
  required.forEach(k => { if (story[k] === undefined) errors.push(`Missing required field: ${k}`); });
  for (const key of ['age_band','text_mode','resolution','aspect_ratio','model','scene_text']) {
    const e = enumFor(key);
    if (story[key] !== undefined && !e.includes(story[key]))
      errors.push(`'${key}' must be one of [${e.join(', ')}] (got: ${story[key]})`);
  }
  const castIds = (story.cast || []).map(c => c.id).filter(Boolean);
  (story.pages || []).forEach((page, i) => {
    (page.cast || []).forEach(cid => {
      if (!castIds.includes(cid))
        errors.push(`Page ${page.page_num}: cast id "${cid}" is not in the cast`);
    });
    for (const key of ['text_placement','text_align','font','model','text_mode','scene_text']) {
      const e = enumFor(key);
      if (page[key] !== undefined && e.length && !e.includes(page[key]))
        errors.push(`Page ${page.page_num}: '${key}' invalid value "${page[key]}"`);
    }
  });
  return errors;
}

function showStatus(cls, msgs, withReload = false) {
  const panel = document.getElementById('status-panel');
  panel.className = 'status-panel ' + cls;
  const items = msgs.map(m => `<li>${esc(m)}</li>`).join('');
  const reload = withReload
    ? `<button class="btn-sm" style="margin-top:8px" onclick="location.reload()">Reload</button>`
    : '';
  panel.innerHTML = `<ul>${items}</ul>${reload}`;
  panel.style.display = 'block';
}
function hideStatus() {
  const p = document.getElementById('status-panel');
  p.className = 'status-panel';
  p.style.display = 'none';
}
// Auto-save hint: subtle header message for background-save errors (no panel spam)
function showAutoSaveHint(msg) {
  const h = document.getElementById('autosave-hint');
  if (h) { h.textContent = msg; h.style.display = ''; }
  const dot = document.getElementById('dirty-dot');
  if (dot) dot.title = msg;
}
function hideAutoSaveHint() {
  const h = document.getElementById('autosave-hint');
  if (h) { h.textContent = ''; h.style.display = 'none'; }
  const dot = document.getElementById('dirty-dot');
  if (dot) dot.title = 'Unsaved changes';
}

// Saving is automatic (debounced on edit) plus the explicit Save button —
// no Cmd/Ctrl+S shortcut (removed so the browser's own Save isn't shadowed).

// ── Dirty guard ────────────────────────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (unsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────
_initMentionPop();
init();
</script>
