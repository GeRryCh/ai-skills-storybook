<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Storybook Editor</title>
<style>
/* ── reset + base ─────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;font-size:14px;background:#f5f5f5;color:#222}
a{color:#2563eb}

/* ── layout ───────────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:100;background:#1e293b;color:#f1f5f9;
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:600;flex:1;min-width:120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
header .dirty-dot{color:#fb923c;font-size:18px;display:none}
header .dirty-dot.visible{display:inline}

.status-panel{padding:8px 16px;font-size:13px;display:none}
.status-panel.error{background:#fee2e2;color:#991b1b;display:block}
.status-panel.warn{background:#fef3c7;color:#92400e;display:block}
.status-panel ul{padding-left:18px}

main{max-width:900px;margin:24px auto;padding:0 16px 80px}
section{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:24px}
section>h2{font-size:14px;font-weight:600;padding:12px 16px;border-bottom:1px solid #e2e8f0;
  background:#f8fafc;border-radius:8px 8px 0 0;cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:8px}
section>h2 .toggle{margin-left:auto;color:#64748b;font-size:12px}
.section-body{padding:16px}
.section-body.collapsed{display:none}

/* ── form elements ────────────────────────────────────────────────────── */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:#475569;margin-bottom:4px}
.field input[type=text],.field select,.field textarea{width:100%;border:1px solid #cbd5e1;
  border-radius:5px;padding:6px 8px;font-size:13px;font-family:inherit;
  background:#fff;transition:border .15s}
.field input[type=text]:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:#6366f1}
.field textarea{resize:vertical;min-height:60px}
.field select.unset{color:#94a3b8}
/* ── Conditional field relevance (PER-48) ─────────────────────────────── */
.field.dep-hidden{display:none}
.field .row{display:flex;gap:8px;align-items:flex-start}
.field .row input{flex:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* ── buttons ──────────────────────────────────────────────────────────── */
button{cursor:pointer;border:none;border-radius:5px;padding:6px 12px;font-size:13px;
  font-family:inherit;font-weight:500;transition:background .15s}
.btn-primary{background:#4f46e5;color:#fff}
.btn-primary:hover{background:#4338ca}
.btn-primary:disabled{background:#94a3b8;cursor:not-allowed}
.btn-sm{background:#f1f5f9;color:#334155;padding:3px 8px;font-size:12px}
.btn-sm:hover{background:#e2e8f0}
.btn-danger{background:#fee2e2;color:#991b1b}
.btn-danger:hover{background:#fecaca}
.btn-add{background:#f0fdf4;color:#166534;border:1px dashed #86efac}
.btn-add:hover{background:#dcfce7}

/* ── palette ──────────────────────────────────────────────────────────── */
.palette-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.palette-row input{flex:1}
.swatch{width:22px;height:22px;border-radius:4px;border:1px solid #cbd5e1;
  flex-shrink:0;background:#e2e8f0}

/* ── character + page cards ───────────────────────────────────────────── */
.card{border:1px solid #e2e8f0;border-radius:6px;margin-bottom:12px;overflow:hidden}
.card-header{background:#f8fafc;padding:8px 12px;display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:600;cursor:pointer}
.card-header .badge-dirty{color:#f97316;font-size:11px;display:none}
.card-header .badge-dirty.visible{display:inline}
.card-header .badge-render{font-size:11px;padding:1px 6px;border-radius:10px;font-weight:500}
.badge-render.rendered{background:#d1fae5;color:#065f46}
.badge-render.edited{background:#fef3c7;color:#92400e}
.badge-render.none{background:#f1f5f9;color:#64748b}
.badge-refs{font-size:11px;padding:1px 6px;border-radius:10px;font-weight:500;display:none}
.badge-refs.warn{background:#fef3c7;color:#92400e;display:inline}
.badge-refs.over{background:#fee2e2;color:#991b1b;display:inline}
.card-header .spacer{flex:1}
.card-header button{font-size:11px;padding:2px 6px}
.card-body{padding:12px;display:none}
.card-body.open{display:block}

.hero-badge{background:#818cf8;color:#fff;font-size:10px;padding:0 5px;border-radius:8px;
  font-weight:700;margin-left:4px}
.kind-badge { display:inline-block; font-size:9px; font-weight:700; padding:1px 5px; border-radius:9px; margin-left:4px; background:#94a3b8; color:#fff; vertical-align:middle; letter-spacing:.5px; }

/* ── page cast ordered list ───────────────────────────────────────────── */
.cast-list{margin-bottom:6px}
.cast-entry{display:flex;align-items:center;gap:6px;margin-bottom:4px;
  background:#f8fafc;border:1px solid #e2e8f0;border-radius:4px;padding:4px 6px}
.cast-entry span{flex:1;font-size:13px}
.uncast-btns{display:flex;flex-wrap:wrap;gap:4px}
.btn-cast-add{background:#ede9fe;color:#5b21b6;font-size:12px;padding:2px 8px;
  border-radius:10px;border:none;cursor:pointer}
.btn-cast-add:hover{background:#ddd6fe}

/* ── ref-image rows ───────────────────────────────────────────────────── */
.ref-row{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.ref-row input{flex:1}
.ref-thumb{width:44px;height:44px;object-fit:cover;border-radius:4px;
  border:1px solid #e2e8f0;flex-shrink:0}
.ref-miss{width:44px;height:44px;border-radius:4px;background:#fee2e2;
  border:1px solid #fca5a5;display:none;font-size:9px;color:#991b1b;
  text-align:center;line-height:44px;flex-shrink:0}

/* ── style sheet preview ──────────────────────────────────────────────── */
.sheet-preview{display:flex;gap:8px;align-items:flex-start;margin-top:4px}
.sheet-preview img{width:60px;height:60px;object-fit:cover;border-radius:4px;
  border:1px solid #e2e8f0}
.sheet-preview .sheet-path{font-size:12px;color:#64748b;word-break:break-all}
.sheet-preview .sheet-missing{color:#ef4444;font-size:12px}

/* ── saved-formats toggle ─────────────────────────────────────────────── */
.sf-toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sf-checks{display:flex;gap:12px;align-items:center}
.sf-checks label{display:flex;gap:4px;align-items:center;font-size:13px;cursor:pointer}

/* ── page image preview + generation history ──────────────────────────── */
.pg-preview-wrap{margin-bottom:14px}
.preview-img-area{margin-bottom:4px}
.preview-img-wrap{position:relative;display:inline-block;max-width:100%}
.preview-img{max-width:100%;max-height:300px;border-radius:6px;
  border:1px solid #e2e8f0;display:block;background:#f8fafc}
.preview-overlay{position:absolute;top:6px;right:6px}
.inuse-badge{background:#065f46;color:#d1fae5;font-size:11px;padding:2px 8px;
  border-radius:10px;font-weight:600;pointer-events:none;white-space:nowrap}
.btn-use-version{background:#f0fdf4;color:#166534;border:1px solid #86efac;
  font-size:11px;padding:2px 8px;border-radius:10px;cursor:pointer;font-weight:600;
  white-space:nowrap}
.btn-use-version:hover{background:#dcfce7}
.preview-nav{display:flex;align-items:center;gap:6px;margin-top:4px}
.ver-counter{font-size:12px;color:#64748b;min-width:38px;text-align:center}
.regen-error{color:#991b1b;font-size:12px;margin-top:4px;background:#fee2e2;
  border-radius:4px;padding:4px 8px}
.regen-error pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
  margin-top:2px;max-height:100px;overflow:auto}
.preview-actions{display:flex;align-items:center;gap:8px;margin-top:6px}
.btn-regen{background:#ede9fe;color:#5b21b6;font-size:12px;padding:4px 10px;
  border-radius:6px;border:none;font-family:inherit;font-weight:500}
.btn-regen:hover:not(:disabled){background:#ddd6fe;cursor:pointer}
.btn-regen:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
.btn-regen-secondary{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0;font-size:11px;font-weight:400}
.btn-regen-secondary:hover:not(:disabled){background:#f1f5f9;cursor:pointer}
.btn-recomp{background:#dcfce7;color:#166534;font-size:12px;padding:4px 10px;
  border-radius:6px;border:none;font-family:inherit;font-weight:600}
.btn-recomp:hover:not(:disabled){background:#bbf7d0;cursor:pointer}
.btn-recomp:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}
.regen-status-inline{font-size:11px;color:#64748b}
/* Consolidate modal */
dialog#consolidate-modal{margin:auto;border:1px solid #e2e8f0;border-radius:10px;
  padding:24px;max-width:480px;width:90%;box-shadow:0 8px 30px rgba(0,0,0,.12)}
dialog#consolidate-modal::backdrop{background:rgba(15,23,42,.45)}
dialog#consolidate-modal h3{margin:0 0 16px;font-size:16px;color:#1e293b}
dialog#consolidate-modal h3 small{font-weight:400;font-size:12px;color:#64748b}
.cm-section{margin-bottom:16px}
.cm-section label{font-size:13px;font-weight:500;color:#374151;display:flex;
  gap:6px;align-items:center;cursor:pointer}
.cm-section .cm-legend{font-size:12px;font-weight:600;color:#475569;
  margin-bottom:6px;display:block}
.cm-zip-row{margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9}
.cm-zip-row small{font-size:11px;color:#94a3b8}
.cm-results{margin:12px 0;min-height:0}
.cm-result-item{font-size:13px;padding:3px 0}
.cm-result-ok{color:#166534}
.cm-result-err{color:#991b1b}
.cm-result-err pre{white-space:pre-wrap;word-break:break-all;font-size:11px;
  margin-top:2px;background:#fee2e2;border-radius:4px;padding:4px 8px;
  max-height:80px;overflow:auto}
.cm-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;
  padding-top:12px;border-top:1px solid #f1f5f9}
</style>
</head>
<body>

<header>
  <h1 id="header-title">story.json editor</h1>
  <span class="dirty-dot" id="dirty-dot" title="Unsaved changes">●</span>
  <span id="autosave-hint" style="font-size:11px;color:#fb923c;opacity:0.9;display:none"></span>
  <button class="btn-primary" id="btn-save" onclick="triggerSave()">Save</button>
</header>

<div class="status-panel" id="status-panel"></div>

<main id="main">
  <p style="color:#64748b">Loading…</p>
</main>

<!-- Consolidate Story modal — lives outside <main> so renderAll() wipes don't remove it -->
<dialog id="consolidate-modal">
  <h3>Consolidate Story <small>(Stage 4 — free, no API calls)</small></h3>
  <div class="cm-section">
    <span class="cm-legend">Formats (saved to story.json):</span>
    <div id="sf-container"></div>
    <div class="cm-zip-row">
      <label>
        <input type="checkbox" id="cm-zip">
        also build zip package <small>(run-time only — story.json + pages + sheets + book files)</small>
      </label>
    </div>
  </div>
  <div class="cm-results" id="cm-results"></div>
  <div class="cm-actions">
    <button class="btn-sm" onclick="closeConsolidateModal()">Close</button>
    <button class="btn-primary" id="cm-run" onclick="runConsolidate()">Run</button>
  </div>
</dialog>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let story = null;
let schema = null;
let storyMtime = null;
const dirtyPages  = new Set(); // unsaved changes — header dot + beforeunload guard
const editedPages = new Set(); // edited since last render — amber badge (not cleared on save)
let renderStatus = {};
let charStatusData = {};
// ── Auto-save state ────────────────────────────────────────────────────────
let autoSaveTimer  = null;  // debounce handle
let saveInFlight   = false; // one PUT at a time
let savePending    = false; // markDirty fired while saveInFlight
let autoSavePaused = false; // set on 409 (concurrent writer); cleared only by reload
// ── Version-history state ───────────────────────────────────────────────────
const _pageVersionData = new Map(); // page_num → {versions: [...], viewIdx: int, fast: {...}}
const _regenPolls      = new Map(); // page_num → intervalId
// ── Regenerate-all state ─────────────────────────────────────────────────────
let _regenAllPoll    = null;  // intervalId while a regenerate-all run is in progress
let _regenAllRunning = false; // true while the run is in-flight (flag for card rebuilds)
// ── Smart-regenerate / Pillow-only tracking ──────────────────────────────────
// editedFields: per-page tracking of which story.json fields changed since the
// last completed render or recomposite (cleared on done, not on save).
// bookPaidEdit: sticky flag — any render-affecting book-level edit forces paid
// for every page; cleared only by page reload.
const editedFields = new Map();   // pageObj → Set<fieldKey>
let   bookPaidEdit = false;
let   unsavedChanges = false; // any unsaved edit (page, cast, or book-level)
// Fields that only affect Pillow post-processing in overlay/long mode —
// changing only these fields makes the fast "Re-composite (free)" path eligible.
// (text_background_prompt excluded: needs a paid bg call.)
const PILLOW_FIELDS = new Set(['text', 'text_placement', 'text_color_hint', 'text_align', 'font']);
// Book-level fields that don't affect renders at all — changes to these never
// set bookPaidEdit (e.g. title is metadata only; saved_formats is a consolidate hint).
const NEUTRAL_BOOK_FIELDS = new Set(['title', 'language', 'saved_formats']);

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [storyResp, schemaResp, statusResp] = await Promise.all([
      fetch('/api/story'),
      fetch('/api/schema'),
      fetch('/api/status'),
    ]);
    story  = await storyResp.json();
    schema = await schemaResp.json();
    window._schema = schema;
    storyMtime = storyResp.headers.get('X-Story-Mtime');
    const status = await statusResp.json();
    renderStatus   = status.pages || {};
    charStatusData = status.cast || {};
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<p style="color:red">Failed to load: ${e.message}</p>`;
    return;
  }
  document.title = (story.title || 'Untitled') + ' — Storybook Editor';
  document.getElementById('header-title').textContent =
    (story.title || 'Untitled') + ' — Storybook Editor';
  renderAll();

  // Resume a regenerate-all run that was started before this page load.
  try {
    const raResp = await fetch('/api/regenerate-all/status');
    const raData = await raResp.json();
    if (raData.ok && raData.status === 'running') {
      _regenAllRunning = true;
      const btn = document.getElementById('btn-regen-all');
      if (btn) { btn.disabled = true; btn.textContent = '↻ Re-generating…'; }
      _regenAllPoll = setInterval(_refreshRegenAllStatus, 2000);
    }
  } catch (_) { /* non-fatal: editor still usable */ }
}

// ── Dirty tracking ─────────────────────────────────────────────────────────
// field: the story.json key that changed (e.g. 'text', 'image_prompt', 'cast').
// Pass field=null or omit to mark as "unknown change" → conservative paid path.
function markDirty(pageObj, field) {
  unsavedChanges = true;
  if (pageObj) {
    dirtyPages.add(pageObj);
    editedPages.add(pageObj);
    // Track which field changed for fast-path eligibility.
    const key = field || '*';  // '*' = unknown → not in PILLOW_FIELDS → paid
    if (!editedFields.has(pageObj)) editedFields.set(pageObj, new Set());
    editedFields.get(pageObj).add(key);
    updateRegenButtons(pageObj.page_num);
  } else if (field === 'fonts') {
    // Book-level fonts map change affects every page's composite.
    (story.pages || []).forEach(p => {
      editedPages.add(p);
      if (!editedFields.has(p)) editedFields.set(p, new Set());
      editedFields.get(p).add('font');
      updateRegenButtons(p.page_num);
    });
  } else if (!field || !NEUTRAL_BOOK_FIELDS.has(field)) {
    // Any render-affecting book-level edit (style_guide, model, text_mode, resolution,
    // aspect_ratio, …) disables the fast path for all pages for this session.
    bookPaidEdit = true;
    // Refresh all regen buttons so the paid button re-appears everywhere.
    (story.pages || []).forEach(p => updateRegenButtons(p.page_num));
  }
  updateDirtyUi();
  // Refresh badges live
  document.querySelectorAll('[data-page-badge]').forEach(el => {
    const idx = parseInt(el.dataset.pageBadge, 10);
    const page = story.pages && story.pages[idx];
    if (page) updatePageBadge(el, page);
  });
  document.querySelectorAll('[data-page-refbadge]').forEach(el => {
    const idx = parseInt(el.dataset.pageRefbadge, 10);
    const page = story.pages && story.pages[idx];
    if (page) updateRefBadge(el, page);
  });
  // Auto-save debounce (skip if paused after a 409)
  if (!autoSavePaused) {
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => triggerSave(true), 1500);
  }
}
function clearDirty() {
  unsavedChanges = false;
  dirtyPages.clear();
  document.getElementById('dirty-dot').title = 'Unsaved changes';
  updateDirtyUi();
}
function updateDirtyUi() {
  const has = unsavedChanges;
  document.getElementById('dirty-dot').classList.toggle('visible', has);
}

// ── Helpers: enum lists from schema ───────────────────────────────────────
function enumFor(key) {
  const sp = schema.properties;
  if (sp[key] && sp[key].enum) return sp[key].enum;
  if (sp.pages && sp.pages.items && sp.pages.items.properties[key])
    return sp.pages.items.properties[key].enum || [];
  return [];
}
function defaultFor(key) {
  const sp = schema.properties;
  if (sp[key] && sp[key].default !== undefined) return sp[key].default;
  if (sp.pages && sp.pages.items && sp.pages.items.properties[key])
    return sp.pages.items.properties[key].default;
  return undefined;
}

// ── Binding helpers ────────────────────────────────────────────────────────
// All bindings write into the live object on change — no re-render on keystroke.

function bindText(el, obj, key, opts = {}) {
  el.value = obj[key] !== undefined ? obj[key] : '';
  const handler = () => {
    const v = el.value;
    if (opts.optional && v === '') {
      delete obj[key];
    } else {
      obj[key] = v;
    }
    if (opts.onchange) opts.onchange(v);
    markDirty(opts.page || null, key);
  };
  el.addEventListener('change', handler);
  if (opts.oninput) el.addEventListener('input', opts.oninput);
}

function makeSelect(opts, labelOverride) {
  return opts.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}

function bindEnum(el, obj, key, enumVals, opts = {}) {
  const absent = obj[key] === undefined;
  const dflt   = opts.defaultVal !== undefined ? opts.defaultVal : defaultFor(key);
  if (opts.optional) {
    const label = dflt !== undefined ? `— unset (default: ${dflt}) —` : '— unset —';
    el.insertAdjacentHTML('afterbegin', `<option value="">  ${esc(label)}</option>`);
  }
  enumVals.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    el.appendChild(opt);
  });
  if (opts.optional && absent) {
    el.value = '';
    el.classList.add('unset');
  } else {
    el.value = obj[key] || '';
  }
  el.addEventListener('change', () => {
    if (opts.optional && el.value === '') {
      delete obj[key];
      el.classList.add('unset');
    } else {
      obj[key] = el.value;
      el.classList.remove('unset');
    }
    if (opts.onchange) opts.onchange(el.value);
    markDirty(opts.page || null, key);
  });
}

// ── Conditional field relevance (PER-48) ──────────────────────────────────
// Effective text mode for a page: page override → book field → schema default.
const effMode = (page) =>
  (page && page.text_mode) || story.text_mode || defaultFor('text_mode') || 'native';
// True if any page's effective mode is long (shared text-bg is consumed by those pages).
const anyLong = () => {
  const ps = story.pages || [];
  return ps.length ? ps.some(p => effMode(p) === 'long') : effMode(null) === 'long';
};

// Dependency rules map: data-dep attribute value → { relevant(page), note(page), options? }
// Each entry controls one field wrapper that carries a matching data-dep attribute.
const FIELD_DEPS = {
  // Book-level text_background_prompt — only consumed when some page renders in long mode.
  'book-text-bg': {
    relevant: () => anyLong(),
  },
  // Page-level text_background_prompt — only meaningful in long mode.
  'page-text-bg': {
    relevant: (page) => effMode(page) === 'long',
  },
  // Page text_placement — no text band on long-mode body pages; cover is always relevant.
  'page-placement': {
    relevant: (page) => effMode(page) !== 'long' || page.page_num === 1,
    // 'floating' is only meaningful in native mode; in overlay/long it degrades to bottom.
    options: { floating: (page) => effMode(page) === 'native' },
  },
};

// Apply dependency rules to [data-dep] wrappers inside rootEl.
// page: the page object for page-scoped rules; null for book-level.
function applyDeps(rootEl, page) {
  if (!rootEl) return;
  rootEl.querySelectorAll('[data-dep]').forEach(wrap => {
    const rule = FIELD_DEPS[wrap.dataset.dep];
    if (!rule) return;
    const ok = rule.relevant(page);
    wrap.classList.toggle('dep-hidden', !ok);
    if (rule.options) {
      const sel = wrap.querySelector('select');
      if (!sel) return;
      for (const [val, cond] of Object.entries(rule.options)) {
        const opt = [...sel.options].find(o => o.value === val);
        if (!opt) continue;
        const on = cond(page);
        opt.disabled = !on;
        // Hard-hide unless it is the currently selected value (avoid silent data loss).
        opt.hidden = !on && sel.value !== val;
      }
    }
  });
}

// ── esc ────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Collapse toggle ────────────────────────────────────────────────────────
function toggleSection(bodyId, toggleEl) {
  const body = document.getElementById(bodyId);
  const open = body.classList.toggle('collapsed');
  toggleEl.textContent = open ? '▶' : '▼';
}

// ── Palette swatches ───────────────────────────────────────────────────────
function hexFromPaletteStr(s) {
  const m = s.match(/#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b/g);
  return m ? m[m.length - 1] : null;
}
function updateSwatch(swatchEl, inputEl) {
  const hex = hexFromPaletteStr(inputEl.value);
  swatchEl.style.background = hex || '#e2e8f0';
  swatchEl.title = hex || 'no hex colour detected';
}

function renderPaletteRows(container) {
  container.innerHTML = '';
  const palette = (story.style_guide && story.style_guide.palette) || [];
  palette.forEach((entry, i) => {
    const row = document.createElement('div');
    row.className = 'palette-row';
    row.innerHTML =
      `<div class="swatch" id="sw-${i}"></div>` +
      `<input type="text" value="${esc(entry)}" placeholder="e.g. warm cream #F5E9D4">` +
      `<button class="btn-sm btn-danger" onclick="removePaletteRow(${i})">✕</button>`;
    container.appendChild(row);
    const inp  = row.querySelector('input');
    const sw   = row.querySelector('.swatch');
    updateSwatch(sw, inp);
    inp.addEventListener('input', () => {
      if (story.style_guide) story.style_guide.palette[i] = inp.value;
      updateSwatch(sw, inp);
      markDirty(null);
    });
  });
}
function removePaletteRow(i) {
  if (story.style_guide && story.style_guide.palette)
    story.style_guide.palette.splice(i, 1);
  renderPaletteRows(document.getElementById('palette-container'));
  markDirty(null);
}
function addPaletteRow() {
  if (!story.style_guide) story.style_guide = {};
  if (!story.style_guide.palette) story.style_guide.palette = [];
  story.style_guide.palette.push('');
  renderPaletteRows(document.getElementById('palette-container'));
  markDirty(null);
}

// ── saved_formats handling ─────────────────────────────────────────────────
// Unset ≠ [] in schema — unset means "all formats" (hint); [] means "no book files" (hint).
// No script reads this field; storybook-consolidate uses it as the default export answer.
function renderSavedFormats(container) {
  const sf = story.saved_formats; // may be undefined or array
  const isExplicit = sf !== undefined;
  container.innerHTML = `
    <div class="sf-toggle-row">
      <label style="display:flex;gap:6px;align-items:center;cursor:pointer">
        <input type="checkbox" id="sf-explicit" ${isExplicit ? 'checked' : ''}>
        Set saved_formats explicitly
      </label>
      <span style="font-size:12px;color:#64748b">
        (unset = all formats; empty = no book files)
      </span>
    </div>
    <div class="sf-checks" id="sf-checks" style="${isExplicit ? '' : 'display:none'}">
      <label><input type="checkbox" id="sf-pdf" ${isExplicit && sf.includes('pdf') ? 'checked' : ''}> pdf</label>
      <label><input type="checkbox" id="sf-epub" ${isExplicit && sf.includes('epub') ? 'checked' : ''}> epub</label>
    </div>`;
  const expl  = container.querySelector('#sf-explicit');
  const checks = container.querySelector('#sf-checks');
  const updateSf = () => {
    if (!expl.checked) {
      delete story.saved_formats;
      checks.style.display = 'none';
    } else {
      checks.style.display = '';
      const vals = [];
      if (container.querySelector('#sf-pdf').checked)  vals.push('pdf');
      if (container.querySelector('#sf-epub').checked) vals.push('epub');
      story.saved_formats = vals;
    }
    // Pass field name so NEUTRAL_BOOK_FIELDS keeps this Pillow-free change
    // from tripping the sticky bookPaidEdit flag (which kills fast re-composite).
    markDirty(null, 'saved_formats');
  };
  expl.addEventListener('change', updateSf);
  container.querySelector('#sf-pdf').addEventListener('change', updateSf);
  container.querySelector('#sf-epub').addEventListener('change', updateSf);
}

// ── Ref-image rows (string-or-array polymorphism) ──────────────────────────
function refList(char) {
  const r = char.ref_image;
  if (r === undefined) return [];
  return Array.isArray(r) ? r : [r];
}
function setRefList(char, arr) {
  if (arr.length === 0)      { delete char.ref_image; }
  else if (arr.length === 1) { char.ref_image = arr[0]; }
  else                       { char.ref_image = arr; }
}

function renderRefRows(container, char) {
  container.innerHTML = '';
  const list = refList(char);
  list.forEach((path, i) => {
    const row = document.createElement('div');
    row.className = 'ref-row';
    const imgSrc = `/img?path=${encodeURIComponent(path)}`;
    row.innerHTML =
      `<input type="text" value="${esc(path)}" placeholder="absolute or relative path to image">` +
      `<img class="ref-thumb" src="${esc(imgSrc)}" title="${esc(path)}">` +
      `<div class="ref-miss" title="File not found on disk">✗</div>` +
      `<button class="btn-sm btn-danger" onclick="removeRef(this)">✕</button>`;
    const inp  = row.querySelector('input');
    const img  = row.querySelector('img');
    const miss = row.querySelector('.ref-miss');
    img.onerror = () => { img.style.display='none'; miss.style.display='flex'; };
    inp.addEventListener('change', () => {
      const arr = refList(char);
      arr[i] = inp.value;
      setRefList(char, arr);
      img.src = `/img?path=${encodeURIComponent(inp.value)}`;
      img.style.display=''; miss.style.display='none';
      markDirty(null);
    });
    row.querySelector('button').addEventListener('click', () => {
      const arr = refList(char);
      arr.splice(i, 1);
      setRefList(char, arr);
      renderRefRows(container, char);
      markDirty(null);
    });
    container.appendChild(row);
  });
  const btn = document.createElement('button');
  btn.className = 'btn-sm btn-add';
  btn.textContent = '+ Add reference image';
  btn.addEventListener('click', () => {
    const arr = refList(char);
    arr.push('');
    setRefList(char, arr);
    renderRefRows(container, char);
    markDirty(null);
  });
  container.appendChild(btn);
}

// ── Cast section ───────────────────────────────────────────────────────────
function renderCast() {
  const sec = document.getElementById('cast-body');
  sec.innerHTML = '';
  (story.cast || []).forEach((char, i) => {
    sec.appendChild(buildCharCard(char, i));
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.style.marginTop = '8px';
  addBtn.textContent = '+ Add cast member';
  addBtn.addEventListener('click', () => {
    if (!story.cast) story.cast = [];
    story.cast.push({ name: '', appearance: '' });
    renderCast();
    markDirty(null);
  });
  sec.appendChild(addBtn);
}

function buildCharCard(char, i) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      <span id="char-title-${i}">${esc(char.name || '(no name)')}${char.kind && char.kind !== 'character' ? ' <span class="kind-badge">' + char.kind.toUpperCase().slice(0,3) + '</span>' : ''}</span>
      <span class="spacer"></span>
      <button class="btn-sm btn-danger" onclick="deleteChar(event,${i})">Delete</button>
      <span class="toggle">▼</span>
    </div>
    <div class="card-body open" id="char-body-${i}">
      <div class="field">
        <label>Name</label>
        <input type="text" id="char-name-${i}" value="${esc(char.name||'')}">
      </div>
      <div class="field">
        <label>Appearance (include exactly one outfit — it locks for the whole book)</label>
        <textarea rows="3" id="char-appearance-${i}">${esc(char.appearance||'')}</textarea>
      </div>
      <div class="field">
        <label>Kind</label>
        <select id="char-kind-${i}"></select>
      </div>
      <div class="field">
        <label>Reference images (absolute paths or relative to story.json)</label>
        <div id="char-refs-${i}"></div>
      </div>
      <div class="field">
        <label>Style sheet (generated by Stage 2 — read-only)</label>
        <div id="char-sheet-${i}"></div>
      </div>
    </div>`;

  const nameInp = card.querySelector(`#char-name-${i}`);
  const titleEl = card.querySelector(`#char-title-${i}`);
  nameInp.addEventListener('change', () => {
    const oldName = char.name;
    const newName = nameInp.value;
    char.name = newName;
    titleEl.textContent = newName || '(no name)';
    // Propagate rename to all pages' cast lists
    if (oldName && oldName !== newName) {
      (story.pages || []).forEach(page => {
        const idx = page.cast ? page.cast.indexOf(oldName) : -1;
        if (idx !== -1) {
          page.cast[idx] = newName;
          dirtyPages.add(page);
        }
      });
      // Re-render pages cast UI only
      renderPages();
    }
    markDirty(null);
  });

  const appTa = card.querySelector(`#char-appearance-${i}`);
  appTa.addEventListener('change', () => { char.appearance = appTa.value; markDirty(null); });

  const kindSel = card.querySelector(`#char-kind-${i}`);
  const kindEnum = kindOf => {
    const schema = window._schema;
    try { return schema.properties.cast.items.properties.kind.enum; } catch(_) { return ['character','object','location']; }
  };
  kindEnum().forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    if ((char.kind || 'character') === v) opt.selected = true;
    kindSel.appendChild(opt);
  });
  kindSel.addEventListener('change', () => {
    if (kindSel.value === 'character') delete char.kind;
    else char.kind = kindSel.value;
    markDirty(null);
  });

  renderRefRows(card.querySelector(`#char-refs-${i}`), char);
  renderSheetPreview(card.querySelector(`#char-sheet-${i}`), char);
  return card;
}

function renderSheetPreview(container, char) {
  container.innerHTML = '';
  const sheet = char.style_sheet;
  if (!sheet) {
    container.innerHTML = '<span style="color:#94a3b8;font-size:12px">Not generated yet (run Stage 2)</span>';
    return;
  }
  // Check status data
  const exists = charStatusData[char.name] && charStatusData[char.name].style_sheet_exists;
  const imgSrc = `/img?path=${encodeURIComponent(sheet)}`;
  container.innerHTML =
    `<div class="sheet-preview">` +
    `<img src="${esc(imgSrc)}" onerror="this.style.display='none'">` +
    `<span class="${exists ? 'sheet-path' : 'sheet-missing'}">${esc(sheet)}</span>` +
    `</div>`;
}

function deleteChar(evt, i) {
  evt.stopPropagation();
  const name = story.cast[i].name;
  const usedOn = (story.pages || []).filter(p =>
    p.cast && p.cast.includes(name));
  if (usedOn.length > 0) {
    if (!confirm(`"${name}" appears on ${usedOn.length} page(s). Delete anyway (will remove from those pages)?`))
      return;
    usedOn.forEach(p => {
      p.cast = p.cast.filter(n => n !== name);
      dirtyPages.add(p);
    });
  }
  story.cast.splice(i, 1);
  renderCast();
  renderPages(); // cast lists on pages change
  markDirty(null);
}

// ── Pages section ──────────────────────────────────────────────────────────
function renderPages() {
  const sec = document.getElementById('pages-body');
  sec.innerHTML = '';
  (story.pages || []).forEach((page, i) => {
    sec.appendChild(buildPageCard(page, i));
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'btn-add';
  addBtn.style.marginTop = '8px';
  addBtn.textContent = '+ Add page';
  addBtn.addEventListener('click', () => {
    if (!story.pages) story.pages = [];
    story.pages.push({
      page_num: story.pages.length + 1,
      text: '',
      image_prompt: '',
      text_placement: 'floating',
      cast: [],
    });
    renderPages();
    markDirty(null);
  });
  sec.appendChild(addBtn);
}

function updatePageBadge(badgeEl, page) {
  const num = page.page_num;
  const rs   = renderStatus[String(num)];
  const rendered = rs && rs.rendered;
  // Use editedPages (not dirtyPages) — amber persists after auto-save until page is re-rendered
  const edited   = editedPages.has(page);
  let cls = 'badge-render ';
  let txt = '';
  if (rendered && !edited)  { cls += 'rendered'; txt = 'rendered'; }
  else if (rendered && edited) { cls += 'edited';   txt = 'rendered · edited'; }
  else                      { cls += 'none';     txt = 'not rendered'; }
  badgeEl.className = cls;
  badgeEl.textContent = txt;
}

// Intent-based reference-image count for a page: every cast entry contributes 1,
// plus 1 if the hero (first character-kind entry) has a ref_image photo.
// Matches the render priority: character sheet + hero photo + other sheets + object/location refs.
// No disk checks — this is a warning about full-render intent, computed client-side.
function pageRefCount(page) {
  const cast = page.cast || [];
  const kindOf = n => { const c = (story.cast || []).find(c => c.name === n); return c ? (c.kind || 'character') : 'character'; };
  const heroName = cast.find(n => kindOf(n) === 'character');
  const hero = heroName ? (story.cast || []).find(c => c.name === heroName) : null;
  return cast.length + (hero && refList(hero).length > 0 ? 1 : 0);
}
const FLASH_IMAGE_MODEL = 'gemini-3.1-flash-image';
function updateRefBadge(badgeEl, page) {
  const n = pageRefCount(page);
  const effModel = (page.model) || story.model || defaultFor('model');
  if (n > 5) {
    badgeEl.className = 'badge-refs over';
    badgeEl.textContent = `${n} refs > pro cap 5 — refs will drop`;
    badgeEl.title = 'Even gemini-3-pro-image accepts at most 5 reference images. The lowest-priority refs (locations first, then objects) are dropped at render and logged.';
  } else if (n === 5 && effModel === FLASH_IMAGE_MODEL) {
    badgeEl.className = 'badge-refs warn';
    badgeEl.textContent = '5 refs → pro required';
    badgeEl.title = 'Flash cap is 4 reference images. Render auto-upgrades this page to gemini-3-pro-image at runtime (story.json unchanged). No manual action needed.';
  } else {
    badgeEl.className = 'badge-refs';
    badgeEl.textContent = '';
    badgeEl.title = '';
  }
}

function buildPageCard(page, i) {
  const card = document.createElement('div');
  card.className = 'card';
  const isFirst = i === 0;
  const isLast  = i === (story.pages || []).length - 1;
  const dirtyMarkup = dirtyPages.has(page)
    ? '<span class="badge-dirty visible">●</span>'
    : '<span class="badge-dirty">●</span>';
  const badgeId = `badge-${i}`;
  card.innerHTML = `
    <div class="card-header" onclick="toggleCard(this)">
      <span>Page ${page.page_num}</span>
      <span class="badge-render none" id="${badgeId}" data-page-badge="${i}"></span>
      <span class="badge-refs" id="badge-refs-${i}" data-page-refbadge="${i}"></span>
      ${dirtyMarkup}
      <span class="spacer"></span>
      ${isFirst ? '' : `<button class="btn-sm" onclick="movePage(event,${i},-1)">↑</button>`}
      ${isLast  ? '' : `<button class="btn-sm" onclick="movePage(event,${i},+1)">↓</button>`}
      <button class="btn-sm btn-danger" onclick="deletePage(event,${i})">✕</button>
      <span class="toggle">▼</span>
    </div>
    <div class="card-body open" id="page-body-${i}">
      <div class="pg-preview-wrap">
        <div id="pg-preview-${page.page_num}" class="preview-img-area"></div>
        <div class="preview-actions">
          <button class="btn-recomp" id="btn-recomp-${page.page_num}" style="display:none"
            onclick="doRecomposite(${page.page_num})">✎ Re-composite (free)</button>
          <button class="btn-regen" id="btn-regen-${page.page_num}"
            onclick="doRegenerate(${page.page_num})">↻ Render</button>
          <span class="regen-status-inline" id="regen-status-${page.page_num}"></span>
        </div>
      </div>
      <div class="field">
        <label>Text (story text on this page; empty for wordless/cover)</label>
        <textarea rows="3" id="pg-text-${i}">${esc(page.text||'')}</textarea>
      </div>
      <div class="field">
        <label>Image prompt (name characters + style; no safe-zone language)</label>
        <textarea rows="3" id="pg-prompt-${i}">${esc(page.image_prompt||'')}</textarea>
      </div>
      <div class="field">
        <label>Cast on this page <small style="color:#94a3b8">(first character-kind entry = hero — also contributes reference photo at render)</small></label>
        <div id="pg-cast-${i}" class="cast-section"></div>
      </div>
      <div class="grid3">
        <div class="field" data-dep="page-placement">
          <label>Text placement</label>
          <select id="pg-placement-${i}"></select>
        </div>
        <div class="field">
          <label>Text align</label>
          <select id="pg-align-${i}"></select>
        </div>
        <div class="field">
          <label>Font</label>
          <select id="pg-font-${i}"></select>
        </div>
      </div>
      <div class="field" style="max-width:260px">
        <label>Text colour</label>
        <select id="pg-colorhint-${i}"></select>
      </div>
      <div class="field" data-dep="page-text-bg">
        <label>Text page background prompt <small style="color:#94a3b8">(long mode only; blank = use the book's shared text-page background; set to generate a dedicated background for this page via an extra paid call)</small></label>
        <input type="text" id="pg-textbgprompt-${i}" placeholder="e.g. a misty forest path at dawn, soft light filtering through leaves">
      </div>
      <div class="grid2">
        <div class="field">
          <label>Text mode <small style="color:#94a3b8">(unset = same as book)</small></label>
          <select id="pg-textmode-${i}"></select>
        </div>
        <div class="field">
          <label>Image model <small style="color:#94a3b8">(unset = same as book)</small></label>
          <select id="pg-model-${i}"></select>
        </div>
      </div>
    </div>`;

  // Badges
  updatePageBadge(card.querySelector(`#${badgeId}`), page);
  updateRefBadge(card.querySelector(`#badge-refs-${i}`), page);

  // Text / prompt
  const textTa   = card.querySelector(`#pg-text-${i}`);
  const promptTa = card.querySelector(`#pg-prompt-${i}`);
  textTa.addEventListener('change', () => { page.text = textTa.value; markDirty(page, 'text'); });
  promptTa.addEventListener('change', () => { page.image_prompt = promptTa.value; markDirty(page, 'image_prompt'); });

  // Selects
  bindEnum(card.querySelector(`#pg-placement-${i}`), page, 'text_placement',
    enumFor('text_placement'), { optional: true, page });
  bindEnum(card.querySelector(`#pg-align-${i}`), page, 'text_align',
    enumFor('text_align'), { optional: true, page });
  bindEnum(card.querySelector(`#pg-font-${i}`), page, 'font',
    enumFor('font'), { optional: true, page });
  // Text mode override — sentinel shows the inherited default (page → book → schema default).
  bindEnum(card.querySelector(`#pg-textmode-${i}`), page, 'text_mode',
    enumFor('text_mode'), { optional: true, page,
      defaultVal: story.text_mode || defaultFor('text_mode'),
      onchange: () => { applyDeps(card, page); applyDeps(document.getElementById('book-body'), null); } });

  // Model override — sentinel shows the inherited default (page → book → schema default).
  bindEnum(card.querySelector(`#pg-model-${i}`), page, 'model',
    enumFor('model'), { optional: true, page, defaultVal: story.model || defaultFor('model') });

  // Color hint — enum dropdown matching established sentinel-inherit pattern (PER-52)
  bindEnum(card.querySelector(`#pg-colorhint-${i}`), page, 'text_color_hint',
    enumFor('text_color_hint'), { optional: true, page });

  // Text page background prompt (long mode only)
  const bgPromptInp = card.querySelector(`#pg-textbgprompt-${i}`);
  bgPromptInp.value = page.text_background_prompt || '';
  bgPromptInp.addEventListener('change', () => {
    if (bgPromptInp.value === '') delete page.text_background_prompt;
    else page.text_background_prompt = bgPromptInp.value;
    markDirty(page, 'text_background_prompt');  // not Pillow-only: needs paid bg call
  });

  // Cast
  renderPageCast(card.querySelector(`#pg-cast-${i}`), page);

  // Apply field-dependency rules (PER-48).
  applyDeps(card, page);

  // Preview: if page is rendered or regen is in flight, populate the img area async.
  const _pnum = page.page_num;
  updateRegenButtons(_pnum);
  if (renderStatus[String(_pnum)]?.rendered || _regenPolls.has(_pnum)) {
    fetchVersions(_pnum);
  }

  return card;
}

// Ordered page cast: selected names as drag-free reorderable list, unselected as + buttons
function renderPageCast(container, page) {
  container.innerHTML = '';
  const selected = page.cast || [];
  const castNames = (story.cast || []).map(c => c.name).filter(Boolean);

  // Helper: get kind for a cast name
  const kindOf = name => {
    const c = (story.cast || []).find(c => c.name === name);
    return c ? (c.kind || 'character') : 'character';
  };

  // Hero = first character-kind entry (not literal-first)
  const heroIdx = selected.findIndex(n => kindOf(n) === 'character');

  // Selected list
  const listDiv = document.createElement('div');
  listDiv.className = 'cast-list';
  selected.forEach((name, j) => {
    const entry = document.createElement('div');
    entry.className = 'cast-entry';
    const isHero = j === heroIdx;
    const entryKind = kindOf(name);
    const kindBadge = entryKind !== 'character'
      ? `<span class="kind-badge" title="${entryKind}">${entryKind.toUpperCase().slice(0,3)}</span>`
      : '';
    entry.innerHTML =
      `<span>${esc(name)}${isHero ? '<span class="hero-badge" title="First character-kind entry also contributes their reference photo at render time">HERO</span>' : ''}${kindBadge}</span>` +
      `${j > 0 ? `<button class="btn-sm" onclick="">↑</button>` : '<span style="width:28px"></span>'}` +
      `${j < selected.length - 1 ? `<button class="btn-sm" onclick="">↓</button>` : '<span style="width:28px"></span>'}` +
      `<button class="btn-sm btn-danger" onclick="">✕</button>`;
    const btns = entry.querySelectorAll('button');
    // ↑
    if (j > 0) btns[0].addEventListener('click', () => {
      page.cast.splice(j - 1, 0, page.cast.splice(j, 1)[0]);
      markDirty(page, 'cast');
      renderPageCast(container, page);
    });
    // ↓
    if (j < selected.length - 1) {
      const db = j > 0 ? btns[1] : btns[0];
      db.addEventListener('click', () => {
        page.cast.splice(j + 1, 0, page.cast.splice(j, 1)[0]);
        markDirty(page, 'cast');
        renderPageCast(container, page);
      });
    }
    // ✕
    btns[btns.length - 1].addEventListener('click', () => {
      page.cast.splice(j, 1);
      markDirty(page, 'cast');
      renderPageCast(container, page);
    });
    listDiv.appendChild(entry);
  });
  container.appendChild(listDiv);

  // Unselected cast — show as + buttons
  const unsel = castNames.filter(n => !selected.includes(n));
  if (unsel.length > 0) {
    const unselDiv = document.createElement('div');
    unselDiv.className = 'uncast-btns';
    unsel.forEach(name => {
      const btn = document.createElement('button');
      btn.className = 'btn-cast-add';
      btn.textContent = '+ ' + name;
      btn.addEventListener('click', () => {
        if (!page.cast) page.cast = [];
        page.cast.push(name);
        markDirty(page, 'cast');
        renderPageCast(container, page);
      });
      unselDiv.appendChild(btn);
    });
    container.appendChild(unselDiv);
  }
}

function movePage(evt, i, dir) {
  evt.stopPropagation();
  const pages = story.pages;
  const j = i + dir;
  if (j < 0 || j >= pages.length) return;
  [pages[i], pages[j]] = [pages[j], pages[i]];
  renumberPages();
  renderPages();
}

function deletePage(evt, i) {
  evt.stopPropagation();
  const page = story.pages[i];
  dirtyPages.delete(page);
  editedPages.delete(page);
  editedFields.delete(page);  // clean up stale fast-path tracking
  story.pages.splice(i, 1);
  renumberPages();
  renderPages();
  markDirty(null);
}

function renumberPages() {
  (story.pages || []).forEach((page, i) => {
    const newNum = i + 1;
    if (page.page_num !== newNum) {
      page.page_num = newNum;
      unsavedChanges = true;
      dirtyPages.add(page);
      // page_num change is a render-affecting edit (page reorder)
      if (!editedFields.has(page)) editedFields.set(page, new Set());
      editedFields.get(page).add('page_num');
    }
  });
  updateDirtyUi();
}

// ── Smart-regenerate button logic ──────────────────────────────────────────

// Returns true when all in-session edits for this page are Pillow-only and the
// server has confirmed the raw/art/bg prerequisite exists (fast.eligible).
// Conservative: unknown fields, native mode, and any render-affecting book edit
// all disable the fast path (current behavior = paid re-render).
function fastAvailable(num) {
  if (bookPaidEdit) return false;
  // text_mode absent → native (default) → no Pillow split
  const mode = story.text_mode;
  if (mode !== 'overlay' && mode !== 'long') return false;
  const page = (story.pages || []).find(p => p.page_num === num);
  if (!page) return false;
  const fields = editedFields.get(page);
  if (!fields || fields.size === 0) return false;
  if (![...fields].every(f => PILLOW_FIELDS.has(f))) return false;
  const serverFast = (_pageVersionData.get(num) || {}).fast;
  return !!(serverFast && serverFast.eligible);
}

// Central function: update both regen buttons for a given page_num.
// This is the ONLY place that sets labels/visibility so poll flicker is impossible.
function updateRegenButtons(num, regen) {
  const recompBtn = document.getElementById(`btn-recomp-${num}`);
  const regenBtn  = document.getElementById(`btn-regen-${num}`);
  const statusEl  = document.getElementById(`regen-status-${num}`);
  if (!regenBtn) return;

  const running  = regen ? regen.status === 'running' : (_regenPolls.has(num) || _regenAllRunning);
  const hasVers  = (_pageVersionData.get(num) || {}).versions?.length > 0;
  const fast     = !running && fastAvailable(num);

  if (running) {
    if (recompBtn) { recompBtn.style.display = 'none'; recompBtn.disabled = true; }
    regenBtn.disabled    = true;
    regenBtn.textContent = '↻ Rendering…';
    regenBtn.classList.remove('btn-regen-secondary');
    if (statusEl) statusEl.textContent = 'rendering…';
  } else if (fast) {
    if (recompBtn) { recompBtn.style.display = ''; recompBtn.disabled = false; }
    regenBtn.disabled    = false;
    regenBtn.textContent = '↻ Re-render (paid)';
    regenBtn.classList.add('btn-regen-secondary');
    if (statusEl) statusEl.textContent = '';
  } else {
    if (recompBtn) { recompBtn.style.display = 'none'; recompBtn.disabled = true; }
    regenBtn.disabled    = false;
    regenBtn.textContent = hasVers ? '↻ Regenerate' : '↻ Render';
    regenBtn.classList.remove('btn-regen-secondary');
    if (statusEl) statusEl.textContent = '';
  }
}

// ── Page image preview + generation history ────────────────────────────────

// Render the preview img-area for a given page_num using cached version data
// and a (possibly partial) API payload.  Called from fetchVersions and from
// the arrow / select handlers.
function _renderVersionUI(num, apiData) {
  const area = document.getElementById(`pg-preview-${num}`);
  if (!area) return;

  const vd = _pageVersionData.get(num);
  const versions = (apiData && apiData.versions) || (vd && vd.versions) || [];
  const viewIdx  = vd ? vd.viewIdx : 0;
  const regen    = (apiData && apiData.regen) || {};

  if (versions.length === 0) {
    area.innerHTML = '';
    updateRegenButtons(num, regen);
    return;
  }

  const v    = versions[Math.min(viewIdx, versions.length - 1)];
  const n    = versions.length;
  const buster = encodeURIComponent(v.mtime || '');
  const imgSrc = `/img?path=${encodeURIComponent(v.path)}&t=${buster}`;

  area.innerHTML =
    `<div class="preview-img-wrap">` +
    `<img class="preview-img" src="${esc(imgSrc)}" alt="Page ${num} v${viewIdx+1}"` +
    ` onerror="this.alt='image not found on disk'">` +
    `<div class="preview-overlay">` +
    (v.in_use
      ? `<span class="inuse-badge">✓ Used in book</span>`
      : `<button class="btn-use-version" onclick="_clickSelectVersion(${num}, '${esc(v.id)}')">Use in book</button>`) +
    `</div></div>` +
    (n > 1
      ? `<div class="preview-nav">` +
        `<button class="btn-sm" ${viewIdx <= 0 ? 'disabled' : ''} onclick="_prevVersion(${num})">‹</button>` +
        `<span class="ver-counter">${viewIdx + 1} / ${n}</span>` +
        `<button class="btn-sm" ${viewIdx >= n - 1 ? 'disabled' : ''} onclick="_nextVersion(${num})">›</button>` +
        `</div>`
      : '') +
    (regen.status === 'error'
      ? `<div class="regen-error">⚠ Render failed:<pre>${esc((regen.error || '').slice(-400))}</pre></div>`
      : '');

  // Delegate all button state to the central function (kills poll flicker)
  updateRegenButtons(num, regen);
}

// Fetch /api/versions for page_num, cache, and update the UI.
// Pure — does NOT mutate the canonical slot.
async function fetchVersions(num) {
  try {
    const resp = await fetch(`/api/versions?page=${num}`);
    const data = await resp.json();
    if (!data.ok) return;

    const versions = data.versions || [];
    const prev     = _pageVersionData.get(num);
    // Preserve the user's current scroll position in the history list.
    const prevIdx  = prev ? prev.viewIdx : -1;
    const inUseIdx = versions.findIndex(v => v.in_use);
    let viewIdx = inUseIdx >= 0 ? inUseIdx : 0;
    if (prevIdx >= 0 && prevIdx < versions.length) viewIdx = prevIdx;
    // Cache fast-path hint alongside version data.
    _pageVersionData.set(num, {versions, viewIdx, fast: data.fast});

    _renderVersionUI(num, data);

    // If a poll is running and the regen/recomposite just finished, stop polling and
    // update the page's render badge.
    const status = data.regen && data.regen.status;
    if (_regenPolls.has(num) && (status === 'done' || status === 'error')) {
      stopRegenPoll(num);
      if (status === 'done') {
        renderStatus[String(num)] = {rendered: true};
        const cardIdx = (story.pages || []).findIndex(p => p.page_num === num);
        if (cardIdx >= 0) {
          const p = story.pages[cardIdx];
          editedPages.delete(p);
          editedFields.delete(p);  // clear fast-path tracking — composite applied
          const badgeEl = document.querySelector(`[data-page-badge="${cardIdx}"]`);
          if (badgeEl) updatePageBadge(badgeEl, p);
        }
        updateRegenButtons(num, data.regen);
      }
    }
  } catch (e) {
    console.warn('fetchVersions failed for page', num, e);
  }
}

function startRegenPoll(num) {
  stopRegenPoll(num);
  _regenPolls.set(num, setInterval(() => fetchVersions(num), 2000));
}
function stopRegenPoll(num) {
  if (_regenPolls.has(num)) {
    clearInterval(_regenPolls.get(num));
    _regenPolls.delete(num);
  }
}

// Arrow navigation through the version list.
function _prevVersion(num) {
  const vd = _pageVersionData.get(num);
  if (!vd || vd.viewIdx <= 0) return;
  vd.viewIdx--;
  _renderVersionUI(num, {versions: vd.versions, regen: null});
}
function _nextVersion(num) {
  const vd = _pageVersionData.get(num);
  if (!vd || vd.viewIdx >= vd.versions.length - 1) return;
  vd.viewIdx++;
  _renderVersionUI(num, {versions: vd.versions, regen: null});
}

// "Use in book" button: POST /api/page/select then refresh UI.
async function _clickSelectVersion(num, versionId) {
  try {
    const resp = await fetch('/api/page/select', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num, version: versionId}),
    });
    const data = await resp.json();
    if (!data.ok) {
      alert('Could not select version: ' + (data.error || 'unknown error'));
      return;
    }
    const versions = data.versions || [];
    const cur      = _pageVersionData.get(num);
    // Stay on the same position (now marked in_use).
    _pageVersionData.set(num, {versions, viewIdx: cur ? cur.viewIdx : 0});
    _renderVersionUI(num, data);
  } catch (e) {
    alert('Network error while selecting version: ' + e.message);
  }
}

// Free re-composite handler: flush save → POST recomposite → poll.
// No confirm dialog — zero cost and the current image is archived first.
// On server 422 (prerequisite missing), offers a paid re-render fallback.
async function doRecomposite(num) {
  // Flush pending save so render_book.py reads the latest text fields.
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try re-compositing.');
      return;
    }
  }

  updateRegenButtons(num, {status: 'running'});  // show Rendering… immediately

  try {
    const resp = await fetch('/api/page/recomposite', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      updateRegenButtons(num);  // restore button state
      if (data.fallback) {
        // Prerequisite raw/art/bg is missing — offer paid fallback.
        if (confirm(`Fast re-composite unavailable:\n${data.error || ''}\n\nRun a full paid re-render instead?`)) {
          doRegenerate(num);
        }
      } else {
        alert('Could not start re-composite:\n\n' + (data.error || resp.statusText));
      }
      return;
    }
    startRegenPoll(num);
  } catch (e) {
    updateRegenButtons(num);
    alert('Network error: ' + e.message);
  }
}

// Regenerate button handler: confirm → flush save → POST regenerate → poll.
async function doRegenerate(num) {
  const n = (story.pages || []).find(p => p.page_num === num);
  const hasVersions = (_pageVersionData.get(num) || {}).versions?.length > 0;
  const msg = hasVersions
    ? `Regenerate page ${num}?\n\nThis generates a new image (one paid Gemini call).\nThe current image will be saved to history.`
    : `Render page ${num}?\n\nThis generates the image (one paid Gemini call).`;
  if (!confirm(msg)) return;

  // Flush pending auto-save so render_book.py reads the latest image_prompt.
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try regenerating.');
      return;
    }
  }

  const btn      = document.getElementById(`btn-regen-${num}`);
  const statusEl = document.getElementById(`regen-status-${num}`);
  if (btn)      { btn.disabled = true; btn.textContent = '↻ Rendering…'; }
  if (statusEl) { statusEl.textContent = 'starting…'; }

  try {
    const resp = await fetch('/api/page/regenerate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page_num: num}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (btn)      { btn.disabled = false; btn.textContent = hasVersions ? '↻ Regenerate' : '↻ Render'; }
      if (statusEl) { statusEl.textContent = ''; }
      alert('Could not start render:\n\n' + (data.error || resp.statusText));
      return;
    }
    startRegenPoll(num);
  } catch (e) {
    if (btn)      { btn.disabled = false; btn.textContent = hasVersions ? '↻ Regenerate' : '↻ Render'; }
    if (statusEl) { statusEl.textContent = ''; }
    alert('Network error: ' + e.message);
  }
}

// ── Consolidate Story modal ────────────────────────────────────────────────
let _consolidatePoll = null;

function openConsolidateModal() {
  const dlg = document.getElementById('consolidate-modal');
  // Render the saved_formats tri-state into the modal's #sf-container.
  renderSavedFormats(document.getElementById('sf-container'));
  document.getElementById('cm-zip').checked = false;
  // Resume status poll if a consolidation job is already running.
  _refreshConsolidateStatus();
  dlg.showModal();
}

function closeConsolidateModal() {
  document.getElementById('consolidate-modal').close();
}

// Close on backdrop click (click whose target IS the dialog element itself).
document.addEventListener('DOMContentLoaded', () => {
  const dlg = document.getElementById('consolidate-modal');
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => {
    if (_consolidatePoll) { clearInterval(_consolidatePoll); _consolidatePoll = null; }
  });
});

async function runConsolidate() {
  // Compute effective formats from the tri-state + zip toggle.
  const sf = story.saved_formats; // undefined | array
  const eff = sf === undefined ? ['pdf', 'epub'] : sf;   // unset = all; [] = none
  const formats = [...eff];
  if (document.getElementById('cm-zip').checked) formats.push('zip');

  if (!formats.length) {
    alert('Nothing to export. Enable at least one format in Saved formats, or check "also build zip".');
    return;
  }

  // Flush unsaved edits so the scripts read the latest story.json (including
  // any saved_formats change made inside this modal before clicking Run).
  if (unsavedChanges) {
    await triggerSave(false);
    if (unsavedChanges) {
      alert('Please save your changes first, then try consolidating.');
      return;
    }
  }

  const runBtn = document.getElementById('cm-run');
  runBtn.disabled = true;
  runBtn.textContent = 'Running…';
  document.getElementById('cm-results').innerHTML = '';

  try {
    const resp = await fetch('/api/consolidate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({formats}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      runBtn.disabled = false;
      runBtn.textContent = 'Run';
      alert('Could not start consolidation:\n\n' + (data.error || resp.statusText));
      return;
    }
    _consolidatePoll = setInterval(_refreshConsolidateStatus, 1500);
  } catch (e) {
    runBtn.disabled = false;
    runBtn.textContent = 'Run';
    alert('Network error: ' + e.message);
  }
}

async function _refreshConsolidateStatus() {
  try {
    const resp = await fetch('/api/consolidate/status');
    if (!resp.ok) return;
    const data = await resp.json();

    // Render per-format results live.
    const resultsEl = document.getElementById('cm-results');
    if (resultsEl && data.results && data.results.length) {
      resultsEl.innerHTML = data.results.map(r => {
        if (r.ok) {
          return `<div class="cm-result-item cm-result-ok">✓ ${r.format}${r.path ? ` → <code>${r.path}</code>` : ''}</div>`;
        }
        return `<div class="cm-result-item cm-result-err">✗ ${r.format}` +
          (r.error ? `<div class="regen-error"><pre>${r.error.replace(/</g,'&lt;')}</pre></div>` : '') +
          `</div>`;
      }).join('');
    }

    // Stop polling on terminal states.
    if (data.status === 'done' || data.status === 'error') {
      if (_consolidatePoll) { clearInterval(_consolidatePoll); _consolidatePoll = null; }
      const runBtn = document.getElementById('cm-run');
      if (runBtn) { runBtn.disabled = false; runBtn.textContent = 'Run'; }
    }
  } catch (_) { /* network blip — keep polling */ }
}

// ── Re-generate all pages ─────────────────────────────────────────────────
async function doRegenerateAll() {
  const pages = story.pages || [];
  const n = pages.length;
  if (n === 0) { alert('No pages in story to render.'); return; }

  // Primary confirm: cost + history note + style-sheet reminder.
  const msg =
    `Re-generate all ${n} page${n === 1 ? '' : 's'}?\n\n` +
    `This makes ${n} paid Gemini call${n === 1 ? '' : 's'} (one per page) and replaces every ` +
    `page image. Current images are saved to history.\n\n` +
    `Note: style sheets are NOT regenerated — re-run Stage 2 first if you changed ` +
    `style_guide and want the sheets to reflect the new settings.`;
  if (!confirm(msg)) return;

  // Second confirm for long-mode books: shared bg may be stale.
  let fresh_bg = false;
  const hasLong = story.text_mode === 'long' ||
    pages.some(p => p.text_mode === 'long');
  if (hasLong) {
    fresh_bg = confirm(
      'Also regenerate the text-page background?\n\n' +
      '+1 paid Gemini call (and +1 per page that has a dedicated background).\n\n' +
      'A style_guide change makes the old background stale — this replaces it. ' +
      'Cancel keeps the current background.'
    );
  }

  // Flush unsaved edits so render_book.py reads the latest story.json.
  if (dirtyPages.size > 0) {
    await triggerSave(false);
    if (dirtyPages.size > 0) {
      alert('Please save your changes first, then try re-generating.');
      return;
    }
  }

  const btn = document.getElementById('btn-regen-all');
  const statusEl = document.getElementById('regen-all-status');
  if (btn) { btn.disabled = true; btn.textContent = '↻ Re-generating…'; }
  if (statusEl) { statusEl.textContent = 'starting…'; }
  const errEl = document.getElementById('regen-all-error');
  if (errEl) { errEl.style.display = 'none'; errEl.innerHTML = ''; }

  try {
    const resp = await fetch('/api/regenerate-all', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({fresh_bg}),
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (btn) { btn.disabled = false; btn.textContent = '↻ Re-generate All Pages'; }
      if (statusEl) { statusEl.textContent = ''; }
      alert('Could not start re-generation:\n\n' + (data.error || resp.statusText));
      return;
    }

    // Mark all pages running and start the poll.
    _regenAllRunning = true;
    pages.forEach(p => updateRegenButtons(p.page_num, {status: 'running'}));
    _regenAllPoll = setInterval(_refreshRegenAllStatus, 2000);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = '↻ Re-generate All Pages'; }
    if (statusEl) { statusEl.textContent = ''; }
    alert('Network error: ' + e.message);
  }
}

async function _refreshRegenAllStatus() {
  try {
    const resp = await fetch('/api/regenerate-all/status');
    if (!resp.ok) return;
    const data = await resp.json();

    // Update progress text.
    const statusEl = document.getElementById('regen-all-status');
    if (statusEl && data.status === 'running') {
      statusEl.textContent = `rendering… ${data.done}/${data.total}`;
    }

    // Terminal: done or error.
    if (data.status === 'done' || data.status === 'error') {
      if (_regenAllPoll) { clearInterval(_regenAllPoll); _regenAllPoll = null; }
      _regenAllRunning = false;

      const btn = document.getElementById('btn-regen-all');
      if (btn) { btn.disabled = false; btn.textContent = '↻ Re-generate All Pages'; }
      if (statusEl) { statusEl.textContent = ''; }

      // Show aggregate error if any.
      const errEl = document.getElementById('regen-all-error');
      if (errEl && data.status === 'error' && data.error) {
        errEl.style.display = '';
        errEl.innerHTML = `⚠ Re-generation failed:<pre>${esc(data.error.slice(-600))}</pre>`;
      }

      // Refresh global render status and all page badges.
      try {
        const srResp = await fetch('/api/status');
        const srData = await srResp.json();
        if (srData.ok) {
          renderStatus = srData.pages || {};
          document.querySelectorAll('[data-page-badge]').forEach(el => {
            const idx = parseInt(el.dataset.pageBadge, 10);
            const page = story.pages && story.pages[idx];
            if (page) updatePageBadge(el, page);
          });
        }
      } catch (_) { /* non-fatal */ }

      // Clear per-page edit state for successfully rendered pages; update previews.
      const pages = story.pages || [];
      pages.forEach(p => {
        const num = p.page_num;
        const pageEntry = data.pages && data.pages[String(num)];
        if (pageEntry && pageEntry.status === 'done') {
          editedPages.delete(p);
          editedFields.delete(p);
        }
        // fetchVersions updates the preview panel, regen badge, and regen buttons.
        fetchVersions(num);
      });

      // Reset bookPaidEdit only when every page succeeded — all book-level edits applied.
      if (data.status === 'done') {
        bookPaidEdit = false;
        pages.forEach(p => updateRegenButtons(p.page_num));
      }
    }
  } catch (_) { /* network blip — keep polling */ }
}

// ── Save ───────────────────────────────────────────────────────────────────
// auto=true: quiet failures (no error panel spam); auto=false: loud (manual Save / Ctrl-S).
// 409 is always loud and pauses all future auto-saves until the page is reloaded.
async function triggerSave(auto = false) {
  // Nothing to save — timer may fire after a manual save beat it
  if (auto && !unsavedChanges) return;

  const btn = document.getElementById('btn-save');

  // Client-side pre-flight
  const localErrors = clientValidate();
  if (localErrors.length) {
    if (!auto) showStatus('error', localErrors);
    else       showAutoSaveHint(`unsaved · ${localErrors.length} error${localErrors.length > 1 ? 's' : ''}`);
    return;
  }

  // In-flight serialization: queue at most one pending save; prevents self-409
  if (saveInFlight) { savePending = true; return; }
  saveInFlight = true;

  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const resp = await fetch('/api/story', {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        ...(storyMtime ? {'X-Story-Mtime': storyMtime} : {}),
      },
      body: JSON.stringify(story),
    });
    const data = await resp.json();
    if (resp.status === 409) {
      // Always loud — concurrent writer (e.g. Stage 2 wrote style_sheet) — pause auto-save
      autoSavePaused = true;
      showStatus('error', [data.error + ' — click "Reload" to load the latest version.'], true);
      return;
    }
    if (resp.status === 422) {
      if (!auto) showStatus('error', data.errors.concat(data.warnings.map(w => '⚠ ' + w)));
      else       showAutoSaveHint('unsaved · validation error');
      return;
    }
    if (!resp.ok) {
      if (!auto) showStatus('error', [data.error || 'Unknown server error']);
      else       showAutoSaveHint('unsaved · server error');
      return;
    }
    storyMtime = data.mtime;
    clearDirty();
    hideAutoSaveHint();
    renderPages(); // refresh badges
    if (data.warnings && data.warnings.length) {
      showStatus('warn', data.warnings.map(w => '⚠ ' + w));
    } else if (!auto) {
      hideStatus();
    }
    // Refetch status after save (style_sheet may now exist)
    const sr = await fetch('/api/status');
    const sd = await sr.json();
    renderStatus   = sd.pages || {};
    charStatusData = sd.cast || {};
    renderPages();
  } catch (e) {
    if (!auto) showStatus('error', ['Network error: ' + e.message]);
    else       showAutoSaveHint('unsaved · network error');
  } finally {
    saveInFlight = false;
    btn.disabled = false;
    btn.textContent = 'Save';
    // Drain the queue: one pending save at most
    if (savePending) { savePending = false; triggerSave(auto); }
  }
}

function clientValidate() {
  const errors = [];
  const required = (schema.required || []);
  required.forEach(k => { if (story[k] === undefined) errors.push(`Missing required field: ${k}`); });
  for (const key of ['age_band','text_mode','resolution','aspect_ratio','model']) {
    const e = enumFor(key);
    if (story[key] !== undefined && !e.includes(story[key]))
      errors.push(`'${key}' must be one of [${e.join(', ')}] (got: ${story[key]})`);
  }
  const castNames = (story.cast || []).map(c => c.name).filter(Boolean);
  (story.pages || []).forEach((page, i) => {
    (page.cast || []).forEach(n => {
      if (!castNames.includes(n))
        errors.push(`Page ${page.page_num}: cast member "${n}" is not in the cast`);
    });
    for (const key of ['text_placement','text_align','font','model','text_mode']) {
      const e = enumFor(key);
      if (page[key] !== undefined && e.length && !e.includes(page[key]))
        errors.push(`Page ${page.page_num}: '${key}' invalid value "${page[key]}"`);
    }
  });
  return errors;
}

function showStatus(cls, msgs, withReload = false) {
  const panel = document.getElementById('status-panel');
  panel.className = 'status-panel ' + cls;
  const items = msgs.map(m => `<li>${esc(m)}</li>`).join('');
  const reload = withReload
    ? `<button class="btn-sm" style="margin-top:8px" onclick="location.reload()">Reload</button>`
    : '';
  panel.innerHTML = `<ul>${items}</ul>${reload}`;
  panel.style.display = 'block';
}
function hideStatus() {
  const p = document.getElementById('status-panel');
  p.className = 'status-panel';
  p.style.display = 'none';
}
// Auto-save hint: subtle header message for background-save errors (no panel spam)
function showAutoSaveHint(msg) {
  const h = document.getElementById('autosave-hint');
  if (h) { h.textContent = msg; h.style.display = ''; }
  const dot = document.getElementById('dirty-dot');
  if (dot) dot.title = msg;
}
function hideAutoSaveHint() {
  const h = document.getElementById('autosave-hint');
  if (h) { h.textContent = ''; h.style.display = 'none'; }
  const dot = document.getElementById('dirty-dot');
  if (dot) dot.title = 'Unsaved changes';
}

// ── Keyboard shortcut ──────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    triggerSave();
  }
});

// ── Dirty guard ────────────────────────────────────────────────────────────
window.addEventListener('beforeunload', e => {
  if (unsavedChanges) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────
init();
</script>
